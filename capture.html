<style>

:root{
  --paper:#FFFFFF; --ink:#000000; --dim:rgba(0,0,0,.55); --line:rgba(0,0,0,.12);
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
html[data-theme="dark"]{ --paper:#080808; --ink:#FFFFFF; --dim:rgba(255,255,255,.6); --line:rgba(255,255,255,.14); }
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#050505;color:#fff;overflow:hidden;
  font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace}

/* ---------- header ---------- */
.cap-header{
  position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;
  gap:16px;padding:calc(14px + var(--safe-top)) 20px 14px;
  background:linear-gradient(180deg,rgba(0,0,0,.65) 0%,rgba(0,0,0,0) 100%);
  transition:opacity .3s ease;
}
.cap-brand{display:flex;align-items:center;gap:10px;background:none;border:none;cursor:pointer;padding:0}
.cap-brand img{width:34px;height:34px;object-fit:contain;filter:brightness(0) invert(1)}
.cap-brand span{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:#fff;opacity:.9}
.cap-nav-right{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:flex-end}
.cap-cats{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.cap-cat-btn{
  background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;
  padding:6px 14px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
  transition:background .15s,border-color .15s;white-space:nowrap;
}
.cap-cat-btn:hover,.cap-cat-btn:focus-visible{border-color:#fff}
.cap-cat-btn.active{background:#fff;color:#000;border-color:#fff}
.cap-links{display:flex;gap:14px;align-items:center}
.cap-links a,.cap-links button{
  background:none;border:none;color:#fff;opacity:.85;font-size:.72rem;letter-spacing:.1em;
  text-transform:uppercase;cursor:pointer;text-decoration:none;padding:0;
}
.cap-links a:hover,.cap-links button:hover{opacity:1;text-decoration:underline}

@media (max-width:860px){
  .cap-header{flex-direction:column;align-items:stretch;gap:10px;padding:calc(12px + var(--safe-top)) 14px 10px}
  .cap-nav-right{flex-direction:column;align-items:stretch;gap:8px}
  .cap-cats{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .cap-cats::-webkit-scrollbar{display:none}
  .cap-links{justify-content:flex-start}
}

/* ---------- discover / slideshow view ---------- */
#discover{position:fixed;inset:0;background:#050505}
.disc-slide{
  position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease;
  display:flex;align-items:center;justify-content:center;
}
.disc-slide.on{opacity:1;z-index:1}
.disc-slide img{
  width:100%;height:100%;object-fit:contain;will-change:transform;
  animation:capKenBurns 9s ease-in-out forwards;
}
@keyframes capKenBurns{
  0%{transform:scale(1.06)}
  100%{transform:scale(1)}
}
@media (prefers-reduced-motion:reduce){
  .disc-slide img{animation:none}
  .disc-slide{transition:opacity .3s ease}
}
.disc-caption{
  position:absolute;left:0;right:0;bottom:0;z-index:2;padding:22px 24px calc(22px + var(--safe-bottom));
  background:linear-gradient(0deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,0) 100%);
  display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none;
}
.disc-caption b{display:block;font-size:1rem;font-weight:600}
.disc-caption span{display:block;font-size:.78rem;opacity:.75;margin-top:2px}
.disc-hint{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;opacity:.6;text-align:right}
.disc-progress{position:absolute;left:0;right:0;top:0;height:2px;background:rgba(255,255,255,.15);z-index:3}
.disc-progress i{display:block;height:100%;background:#fff;width:0%}
.disc-pause{
  position:absolute;right:20px;bottom:calc(90px + var(--safe-bottom));z-index:3;
  background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.3);color:#fff;
  width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:.9rem;
}
@media (max-width:860px){ .disc-pause{right:14px;bottom:calc(78px + var(--safe-bottom))} }

/* ---------- category grid view ---------- */
#catview{position:fixed;inset:0;background:var(--paper);color:var(--ink);overflow-y:auto;display:none;
  padding-top:calc(88px + var(--safe-top));-webkit-overflow-scrolling:touch}
html[data-theme="dark"] #catview{background:#080808;color:#fff}
#catview.on{display:block}
.cat-head{padding:0 24px 18px;max-width:1400px;margin:0 auto}
.cat-head h1{font-size:clamp(1.6rem,4vw,2.4rem);margin:0 0 6px;font-weight:600}
.cat-head p{margin:0;opacity:.6;font-size:.9rem;max-width:56ch}
.cat-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.cat-chip{
  border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;
  padding:6px 14px;font-size:.74rem;letter-spacing:.05em;cursor:pointer;text-transform:uppercase;
}
.cat-chip.active{background:var(--ink);color:var(--paper)}
.cat-grid{
  max-width:1400px;margin:0 auto;padding:8px 20px 60px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;
}
.cat-card{position:relative;border-radius:2px;overflow:hidden;cursor:pointer;background:#111;aspect-ratio:4/5}
.cat-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.cat-card:hover img{transform:scale(1.04)}
.cat-card .cc-cap{
  position:absolute;left:0;right:0;bottom:0;padding:10px 12px;
  background:linear-gradient(0deg,rgba(0,0,0,.75),rgba(0,0,0,0));color:#fff;
  opacity:0;transition:opacity .2s ease;font-size:.78rem;
}
.cat-card:hover .cc-cap{opacity:1}
.cat-empty{opacity:.55;padding:40px 24px;text-align:center}
.cat-back{
  position:fixed;left:20px;bottom:24px;z-index:20;background:var(--ink);color:var(--paper);
  border:none;border-radius:999px;padding:10px 18px;font-size:.74rem;letter-spacing:.08em;
  text-transform:uppercase;cursor:pointer;
}

/* ---------- lightbox ---------- */
#capLb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:60;display:none;
  align-items:center;justify-content:center}
#capLb.on{display:flex}
#capLb img{max-width:92vw;max-height:86vh;object-fit:contain}
.cap-lb-close,.cap-lb-nav{
  position:absolute;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);
  color:#fff;border-radius:50%;width:44px;height:44px;cursor:pointer;font-size:1.1rem;
}
.cap-lb-close{top:calc(16px + var(--safe-top));right:16px}
.cap-lb-prev{left:14px;top:50%;transform:translateY(-50%)}
.cap-lb-next{right:14px;top:50%;transform:translateY(-50%)}
.cap-lb-cap{position:absolute;left:0;right:0;bottom:calc(18px + var(--safe-bottom));text-align:center;color:#fff;font-size:.85rem;opacity:.85}

.skip-link{position:absolute;left:12px;top:-64px;z-index:100;background:#fff;color:#000;padding:10px 16px;
  font-weight:600;font-size:.85rem;text-decoration:none;transition:top .15s ease}
.skip-link:focus{top:12px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>
<body>
<a class="skip-link" href="#catview">Skip to categories</a>

<header class="cap-header" id="capHeader">
  <button class="cap-brand" id="capBrand" aria-label="Back to Home">
    <img src="/logo.png" alt="Living Room Labs">
    <span class="mono">Living Room Labs</span>
  </button>
  <div class="cap-nav-right">
    <nav class="cap-cats" id="capCats" aria-label="Categories"></nav>
    <div class="cap-links">
      <button type="button" id="capCollective">The Collective ↗</button>
      <a href="#" id="capElsewhere" target="_blank" rel="noopener">Elsewhere ↗</a>
    </div>
  </div>
</header>

<div id="discover" role="region" aria-label="Featured photos slideshow">
  <div class="disc-progress"><i id="discBar"></i></div>
  <div id="discSlides"></div>
  <div class="disc-caption">
    <div>
      <b id="discTitle" class="mono">Loading…</b>
      <span id="discMeta"></span>
    </div>
    <div class="disc-hint mono">Click a category above to explore</div>
  </div>
  <button class="disc-pause mono" id="discPause" aria-label="Pause slideshow">❚❚</button>
</div>

<section id="catview" aria-label="Category photos">
  <div class="cat-head">
    <h1 id="catTitle"></h1>
    <p id="catLine"></p>
    <div class="cat-chips" id="catChips"></div>
  </div>
  <div class="cat-grid" id="catGrid"></div>
</section>
<button class="cat-back mono" id="catBack" style="display:none">← Discover</button>

<div id="capLb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="cap-lb-close" id="lbClose" aria-label="Close">✕</button>
  <button class="cap-lb-nav cap-lb-prev" id="lbPrev" aria-label="Previous photo">‹</button>
  <img id="lbImg" src="" alt="">
  <button class="cap-lb-nav cap-lb-next" id="lbNext" aria-label="Next photo">›</button>
  <div class="cap-lb-cap mono" id="lbCap"></div>
</div>

<script>
(function(){
  "use strict";
  var DATA = null, PHOTOS = [], NICHES = [];
  var discoverOrder = [], discoverIdx = -1, discoverTimer = null, discoverPaused = false;
  var DISCOVER_MS = 5000;
  var currentCat = null, currentEvent = null, lbList = [], lbIdx = 0;

  function $(s,r){ return (r||document).querySelector(s); }
  function $all(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }

  /* theme: mirror whatever the homepage lamp is set to */
  try {
    var savedTheme = localStorage.getItem("lrl_theme");
    if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
  } catch(e){}

  fetch("/content.json").then(function(r){ return r.json(); }).then(function(d){
    DATA = d;
    PHOTOS = (d.photos || []).filter(function(p){ return p && p.src; });
    NICHES = d.niches || [];
    boot();
  }).catch(function(err){
    $("#discTitle").textContent = "Could not load photos";
    console.error(err);
  });

  function boot(){
    buildHeader();
    buildDiscover();
    applyParams();
  }

  function buildHeader(){
    var catsHost = $("#capCats");
    catsHost.innerHTML = "";
    NICHES.forEach(function(n){
      var name = (n && n.name) || n;
      var btn = document.createElement("button");
      btn.className = "cap-cat-btn"; btn.type = "button";
      btn.textContent = name;
      btn.setAttribute("data-cat", name);
      btn.addEventListener("click", function(){ showCategory(name); });
      catsHost.appendChild(btn);
    });

    $("#capBrand").addEventListener("click", function(){ window.location.href = "/"; });
    $("#capCollective").addEventListener("click", function(){ window.location.href = "/#collective"; });

    var socials = DATA.socials || [];
    var ig = socials.find(function(s){ return /instagram/i.test(s.name||""); }) || socials[0];
    if (ig && ig.url) $("#capElsewhere").href = ig.url;
    else $("#capElsewhere").style.display = "none";
  }

  /* ---------------- discover (picasa-style slideshow) ---------------- */
  function buildDiscover(){
    var host = $("#discSlides");
    var pool = PHOTOS.filter(function(p){ return p.showInAll !== false; });
    if (!pool.length) pool = PHOTOS;
    discoverOrder = shuffle(pool);
    discoverOrder.forEach(function(p, i){
      var div = document.createElement("div");
      div.className = "disc-slide";
      div.dataset.idx = i;
      host.appendChild(div);
    });
    $("#discPause").addEventListener("click", toggleDiscoverPause);
    nextDiscoverSlide(true);
  }

  function nextDiscoverSlide(first){
    if (!discoverOrder.length) return;
    discoverIdx = (discoverIdx + 1) % discoverOrder.length;
    var p = discoverOrder[discoverIdx];
    var slides = $all(".disc-slide", $("#discSlides"));
    slides.forEach(function(s){ s.classList.remove("on"); });
    var slide = slides[discoverIdx];
    if (!slide.dataset.loaded) {
      var img = document.createElement("img");
      img.src = p.src; img.alt = p.alt || p.title || "";
      slide.appendChild(img);
      slide.dataset.loaded = "1";
    } else {
      /* restart the ken-burns animation on repeat views */
      var im = slide.querySelector("img");
      if (im) { im.style.animation = "none"; void im.offsetWidth; im.style.animation = ""; }
    }
    slide.classList.add("on");
    $("#discTitle").textContent = p.title || "Untitled";
    $("#discMeta").textContent = [p.category, (p.eventTypes||[]).join(", ")].filter(Boolean).join(" · ");
    runDiscoverBar();
    clearTimeout(discoverTimer);
    if (!discoverPaused) discoverTimer = setTimeout(function(){ nextDiscoverSlide(false); }, DISCOVER_MS);
  }

  function runDiscoverBar(){
    var bar = $("#discBar");
    bar.style.transition = "none"; bar.style.width = "0%";
    void bar.offsetWidth;
    if (discoverPaused) return;
    bar.style.transition = "width " + DISCOVER_MS + "ms linear";
    bar.style.width = "100%";
  }

  function toggleDiscoverPause(){
    discoverPaused = !discoverPaused;
    $("#discPause").textContent = discoverPaused ? "▶" : "❚❚";
    $("#discPause").setAttribute("aria-label", discoverPaused ? "Resume slideshow" : "Pause slideshow");
    if (discoverPaused) { clearTimeout(discoverTimer); $("#discBar").style.transition="none"; }
    else { runDiscoverBar(); discoverTimer = setTimeout(function(){ nextDiscoverSlide(false); }, DISCOVER_MS); }
  }

  /* ---------------- category grid ---------------- */
  function showCategory(name, eventFilter){
    currentCat = name; currentEvent = eventFilter || null;
    clearTimeout(discoverTimer);
    $("#discover").style.display = "none";
    $("#catview").classList.add("on");
    $("#catBack").style.display = "block";
    $all(".cap-cat-btn").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-cat") === name); });

    var nicheInfo = NICHES.find(function(n){ return (n.name||n) === name; }) || {};
    $("#catTitle").textContent = name;
    $("#catLine").textContent = nicheInfo.line || "";

    var catPhotos = PHOTOS.filter(function(p){ return p.category === name; });

    /* event-type chips, only where relevant */
    var chipsHost = $("#catChips");
    chipsHost.innerHTML = "";
    var eventTypes = [];
    catPhotos.forEach(function(p){ (p.eventTypes||[]).forEach(function(et){ if (eventTypes.indexOf(et) === -1) eventTypes.push(et); }); });
    if (eventTypes.length) {
      var allChip = document.createElement("button");
      allChip.className = "cat-chip mono" + (!currentEvent ? " active" : "");
      allChip.textContent = "All " + name;
      allChip.addEventListener("click", function(){ showCategory(name, null); });
      chipsHost.appendChild(allChip);
      eventTypes.forEach(function(et){
        var chip = document.createElement("button");
        chip.className = "cat-chip mono" + (currentEvent === et ? " active" : "");
        chip.textContent = et;
        chip.addEventListener("click", function(){ showCategory(name, et); });
        chipsHost.appendChild(chip);
      });
    }

    var visible = currentEvent ? catPhotos.filter(function(p){ return (p.eventTypes||[]).indexOf(currentEvent) > -1; }) : catPhotos;
    renderGrid(visible);
    updateUrl(name, currentEvent);
    $("#catview").scrollTop = 0;
  }

  function renderGrid(list){
    lbList = list;
    var grid = $("#catGrid");
    grid.innerHTML = "";
    if (!list.length) {
      grid.innerHTML = '<div class="cat-empty mono">No photos here yet.</div>';
      return;
    }
    list.forEach(function(p, i){
      var card = document.createElement("div");
      card.className = "cat-card";
      card.innerHTML = '<img loading="lazy" src="'+esc(p.src)+'" alt="'+esc(p.alt||p.title||"")+'" style="object-position:'+esc((p.imagePosition||"center").toLowerCase())+'">'+
        '<div class="cc-cap">'+esc(p.title||"")+(p.client?' <span style="opacity:.7">— '+esc(p.client)+'</span>':'')+'</div>';
      card.addEventListener("click", function(){ openLightbox(i); });
      grid.appendChild(card);
    });
  }

  function backToDiscover(){
    currentCat = null; currentEvent = null;
    $("#catview").classList.remove("on");
    $("#catBack").style.display = "none";
    $("#discover").style.display = "block";
    $all(".cap-cat-btn").forEach(function(b){ b.classList.remove("active"); });
    updateUrl(null, null);
    if (!discoverPaused) discoverTimer = setTimeout(function(){ nextDiscoverSlide(false); }, 400);
  }
  $("#catBack").addEventListener("click", backToDiscover);

  /* ---------------- lightbox ---------------- */
  function openLightbox(i){
    lbIdx = i;
    renderLb();
    $("#capLb").classList.add("on");
    $("#lbClose").focus();
  }
  function renderLb(){
    var p = lbList[lbIdx];
    if (!p) return;
    $("#lbImg").src = p.src;
    $("#lbImg").alt = p.alt || p.title || "";
    $("#lbCap").textContent = [p.title, p.caption].filter(Boolean).join(" — ");
  }
  function closeLb(){ $("#capLb").classList.remove("on"); }
  $("#lbClose").addEventListener("click", closeLb);
  $("#lbPrev").addEventListener("click", function(){ lbIdx = (lbIdx - 1 + lbList.length) % lbList.length; renderLb(); });
  $("#lbNext").addEventListener("click", function(){ lbIdx = (lbIdx + 1) % lbList.length; renderLb(); });
  $("#capLb").addEventListener("click", function(e){ if (e.target.id === "capLb") closeLb(); });

  document.addEventListener("keydown", function(e){
    if ($("#capLb").classList.contains("on")) {
      if (e.key === "Escape") closeLb();
      else if (e.key === "ArrowLeft") $("#lbPrev").click();
      else if (e.key === "ArrowRight") $("#lbNext").click();
      return;
    }
    if (e.key === "Escape" && currentCat) backToDiscover();
  });

  /* ---------------- url params (for footer Events links) ---------------- */
  function applyParams(){
    var params = new URLSearchParams(window.location.search);
    var cat = params.get("category");
    var ev = params.get("event");
    if (cat) showCategory(cat, ev || null);
  }
  function updateUrl(cat, ev){
    var url = new URL(window.location.href);
    if (cat) { url.searchParams.set("category", cat); } else { url.searchParams.delete("category"); }
    if (ev) { url.searchParams.set("event", ev); } else { url.searchParams.delete("event"); }
    window.history.replaceState({}, "", url);
  }
})();
</script>
</body>
</html>
