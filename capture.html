<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">

<title>What We Capture — Living Room Labs</title>
<meta name="description" content="Browse Living Room Labs by category: food, pets, real estate, products, events, portraits and travel photography from Hyderabad.">

<!-- Sync theme from home page localStorage - defaults to light unless the user explicitly picked dark before -->
<script>
  (function(){
    try {
      var saved = localStorage.getItem("lrl_theme");
      if(saved === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      } else {
        document.documentElement.setAttribute("data-theme", "light");
      }
    } catch(e) {}
  })();
</script>

:root{
  --paper:#FFFFFF; --ink:#000000; --dim:rgba(0,0,0,.55); --line:rgba(0,0,0,.12);
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  --header-h:118px; --foot-h:106px;
}
html[data-theme="dark"]{ --paper:#080808; --ink:#FFFFFF; --dim:rgba(255,255,255,.6); --line:rgba(255,255,255,.14); }
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#050505;color:#fff;overflow:hidden;
  font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace}

/* ================= header ================= */
.cap-header{
  position:fixed;top:0;left:0;right:0;z-index:40;
  padding:calc(12px + var(--safe-top)) 20px 10px;
  background:linear-gradient(180deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.35) 70%,rgba(0,0,0,0) 100%);
}
.cap-row1{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}
.cap-brand{display:flex;align-items:center;gap:12px;background:none;border:none;cursor:pointer;padding:0}
.cap-brand img{width:64px;height:64px;object-fit:contain;filter:brightness(0) invert(1)}
.cap-brand-text{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.cap-brand-text b{font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;color:#fff;font-weight:600}
.cap-brand-text span{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6)}

.cap-row1-right{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:flex-end}
.cap-links{display:flex;gap:16px;align-items:center}
.cap-links a,.cap-links button{
  background:none;border:none;color:#fff;opacity:.85;font-size:.72rem;letter-spacing:.1em;
  text-transform:uppercase;cursor:pointer;text-decoration:none;padding:0;white-space:nowrap;
}
.cap-links a:hover,.cap-links button:hover{opacity:1;text-decoration:underline}
/* ".cap-links .cap-enquire" (not just ".cap-enquire") - the generic ".cap-links button{background:none}"
   rule above is more specific and was silently removing this pill, leaving black text on the black header */
.cap-links .cap-enquire{
  background:#fff;color:#000 !important;border-radius:999px;padding:7px 16px !important;
  opacity:1 !important;text-decoration:none !important;font-weight:600;
}
.cap-links .cap-enquire:hover{background:#e8e8e8}

/* While a category is open the page behind the header is white (light mode) or near-black (dark
   mode), so the see-through dark gradient no longer works - the header gets a solid backdrop
   matching the theme, and in light mode every header element switches to dark ink. */
html.cat-open .cap-header{
  background:rgba(8,8,8,.96);border-bottom:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
html[data-theme="light"].cat-open .cap-header{background:rgba(255,255,255,.96);border-bottom-color:rgba(0,0,0,.08)}
html[data-theme="light"].cat-open .cap-brand img{filter:none}
html[data-theme="light"].cat-open .cap-brand-text b{color:#000}
html[data-theme="light"].cat-open .cap-brand-text span{color:rgba(0,0,0,.55)}
html[data-theme="light"].cat-open .cap-links a,
html[data-theme="light"].cat-open .cap-links button{color:#000}
html[data-theme="light"].cat-open #capLampToggle{border-color:rgba(0,0,0,.28) !important}
html[data-theme="light"].cat-open .cap-links .cap-enquire{background:#000;color:#fff !important}
html[data-theme="light"].cat-open .cap-links .cap-enquire:hover{background:#333}
html[data-theme="light"].cat-open .cap-cat-btn{border-color:rgba(0,0,0,.22);color:#000}
html[data-theme="light"].cat-open .cap-cat-btn:hover,
html[data-theme="light"].cat-open .cap-cat-btn:focus-visible{border-color:#000}
html[data-theme="light"].cat-open .cap-cat-btn.active{background:#000;color:#fff;border-color:#000}

.cap-cats{display:flex;gap:6px;flex-wrap:wrap}
.cap-cat-btn{
  background:none;border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:999px;
  padding:6px 14px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
  transition:background .15s,border-color .15s;white-space:nowrap;
}
.cap-cat-btn:hover,.cap-cat-btn:focus-visible{border-color:#fff}
.cap-cat-btn.active{background:#fff;color:#000;border-color:#fff}

@media (max-width:860px){
  .cap-header{padding:calc(10px + var(--safe-top)) 14px 10px}
  .cap-row1{margin-bottom:8px}
  .cap-brand img{width:52px;height:52px}
  .cap-brand-text{display:none}
  .cap-mobile-hide{display:none !important}
  .cap-cats{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;-webkit-overflow-scrolling:touch;justify-content:flex-start}
  .cap-cats::-webkit-scrollbar{display:none}
}

/* ================= discover: continuous flowing carousel ================= */
#discover{position:fixed;inset:0;background:#050505;display:flex;flex-direction:column}
.disc-stage{
  flex:1;position:relative;overflow:hidden;
  padding-top:var(--header-h);padding-bottom:var(--foot-h);
}
.disc-track{
  position:relative;width:100%;height:100%;display:flex;align-items:center;gap:18px;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;cursor:grab;padding:0 4px;
}
.disc-track::-webkit-scrollbar{display:none}
.disc-track.grabbing{cursor:grabbing}
.disc-card{
  position:relative;flex:0 0 auto;border-radius:6px;overflow:hidden;
  height:min(64vh,640px);
  height:min(64vh,640px,calc(100vh - var(--header-h) - var(--foot-h) - 40px));
  cursor:pointer;background:#111;box-shadow:0 24px 60px rgba(0,0,0,.55);
  transform:scale(.7);
  transform-origin:center center;will-change:transform,opacity;
}
.disc-card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.disc-card.is-center{cursor:zoom-in}

.disc-caption{
  position:absolute;left:0;right:0;bottom:var(--foot-h);z-index:2;padding:18px 24px 16px;
  background:linear-gradient(0deg,rgba(0,0,0,.75) 0%,rgba(0,0,0,0) 100%);
  display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none;
}
.disc-caption b{display:block;font-size:1rem;font-weight:600}
.disc-caption span{display:block;font-size:.78rem;opacity:.75;margin-top:2px}
.disc-hint{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;opacity:.55;text-align:right}

.disc-nav-btn{
  position:absolute;top:50%;transform:translateY(-50%);z-index:200;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.28);color:#fff;
  width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:1.15rem;
  opacity:0;transition:opacity .2s ease,background .2s ease;
}
.disc-stage:hover .disc-nav-btn{opacity:.85}
.disc-nav-btn:hover{background:rgba(0,0,0,.6);opacity:1 !important}
.disc-prev{left:14px}
.disc-next{right:14px}
@media (max-width:860px){ .disc-nav-btn{opacity:.6} .disc-card{height:60vh;height:min(60vh,calc(100vh - var(--header-h) - var(--foot-h) - 32px))} }

.disc-pause{
  position:absolute;right:18px;bottom:calc(var(--foot-h) + 70px);z-index:200;
  background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.3);color:#fff;
  width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:.85rem;
}

#capLampToggle{
  border:1px solid rgba(255,255,255,.3) !important;border-radius:999px;padding:6px 14px !important;
  opacity:.9 !important;text-decoration:none !important;font-size:.7rem !important;
}
#capLampToggle[aria-pressed="true"]{background:rgba(255,196,75,.16);border-color:rgba(255,196,75,.55) !important;color:#ffe9c2 !important}

/* ================= Lamplight: your cursor/finger is a lamp - the photo stays dim
   everywhere except a circle that follows you, matching the original concept board
   exactly (a dim base copy of the photo, with a second bright copy masked to a
   circle that reveals it, plus a soft warm glow). Only active in dark mode, only
   inside the full-screen photo viewer. Never blocks clicks, swipes, or the
   prev/next/close buttons - every layer here is pointer-events:none. */
#lbStage{position:relative;display:inline-block;max-width:92vw;max-height:86vh}
#lbStage img{display:block;max-width:92vw;max-height:86vh;object-fit:contain}
#lbImgDim{
  position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  filter:brightness(.16) saturate(.55);opacity:0;transition:opacity .5s ease;pointer-events:none;
}
#lbStage.lamp-on #lbImgDim{opacity:1}
#lbStage.lamp-on #lbImg{
  -webkit-mask-image:radial-gradient(circle var(--lr,240px) at var(--lx,50%) var(--ly,50%), #000 0%, rgba(0,0,0,.9) 55%, rgba(0,0,0,0) 100%);
  mask-image:radial-gradient(circle var(--lr,240px) at var(--lx,50%) var(--ly,50%), #000 0%, rgba(0,0,0,.9) 55%, rgba(0,0,0,0) 100%);
}
#lampLayer{
  position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;
  transition:opacity .5s ease;
  background:radial-gradient(circle calc(var(--lr,240px) * 1.2) at var(--lx,50%) var(--ly,50%), rgba(255,184,77,.22), rgba(255,184,77,0) 72%);
}
#lbStage.lamp-on #lampLayer{opacity:1}
@media (max-width:860px){
  #lbStage{ --lr:150px; }
}
@media (prefers-reduced-motion:reduce){ #lbImgDim,#lampLayer{transition:opacity .2s ease} }

/* ================= category grid view ================= */
#catview{position:fixed;inset:0;background:var(--paper);color:var(--ink);overflow-y:auto;display:none;
  padding-top:calc(var(--header-h) + 12px);-webkit-overflow-scrolling:touch}
html[data-theme="dark"] #catview{background:#080808;color:#fff}
#catview.on{display:block}
/* #catview already reserves the header height with padding-top, so the heading only needs a
   small gap here (it previously added ANOTHER 110-120px, leaving a big empty band above the title) */
.cat-head{padding:6px 24px 14px;max-width:1400px;margin:0 auto}
@media (max-width:640px){
  .cat-head{padding:4px 14px 10px;}
}
.cat-head h1{font-size:clamp(1.6rem,4vw,2.4rem);margin:0 0 6px;font-weight:600}
.cat-head p{margin:0;opacity:.6;font-size:.9rem;max-width:56ch}
.cat-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.cat-chip{
  border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;
  padding:6px 14px;font-size:.74rem;letter-spacing:.05em;cursor:pointer;text-transform:uppercase;
}
.cat-chip.active{background:var(--ink);color:var(--paper)}
.cat-grid{
  max-width:1400px;margin:0 auto;padding:8px 14px calc(var(--foot-h) + 24px);
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
}
/* Tablet size - 3 columns */
@media (min-width:768px){
  .cat-grid{
    grid-template-columns:repeat(3,1fr);gap:12px;padding:8px 20px calc(var(--foot-h) + 20px);
  }
}
/* Desktop - 4+ columns with auto-fill */
@media (min-width:1024px){
  .cat-grid{
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;
  }
}
.cat-card{position:relative;border-radius:2px;overflow:hidden;cursor:pointer;background:#111;aspect-ratio:4/5}
.cat-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.cat-card:hover img{transform:scale(1.04)}
.cat-card .cc-cap{
  position:absolute;left:0;right:0;bottom:0;padding:10px 12px;
  background:linear-gradient(0deg,rgba(0,0,0,.75),rgba(0,0,0,0));color:#fff;
  opacity:0;transition:opacity .2s ease;font-size:.78rem;
}
.cat-card:hover .cc-cap{opacity:1}
/* Show captions on mobile/touch devices */
@media (max-width:768px){
  .cat-card .cc-cap{
    opacity:1;
  }
}
.cat-empty{opacity:.55;padding:40px 24px;text-align:center}
.cap-foot{
  position:fixed;left:0;right:0;bottom:0;z-index:25;
  display:flex;align-items:center;gap:18px;
  padding:14px 32px calc(14px + var(--safe-bottom));
  background:rgba(255,255,255,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);color:var(--ink);
  transition:background .35s ease, border-color .35s ease, color .35s ease;
}
html[data-theme="dark"] .cap-foot{ background:rgba(8,8,8,.85); }
.cap-foot-logo{width:76px;height:auto;object-fit:contain;opacity:.9;flex:none}
.cap-foot-text{flex:1;min-width:0;text-align:left}
.cap-foot-text b{display:block;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;opacity:.9;font-weight:600}
.cap-foot-text p{margin:3px 0 0;font-size:.82rem;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-cap-foot-enquire{
  border:1px solid var(--ink);background:none;color:var(--ink);border-radius:999px;
  padding:9px 22px;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;flex:none;
  white-space:nowrap;
}
.btn-cap-foot-enquire:hover{background:var(--ink);color:var(--paper)}
html[data-theme="dark"] .cap-foot-logo{filter:brightness(0) invert(1);opacity:.8}
@media (max-width:640px){
  :root{ --foot-h:88px; }
  .cap-foot{ padding:16px 16px calc(16px + var(--safe-bottom)); gap:12px; }
  .cap-foot-logo{width:40px;height:40px}
  .cap-foot-text b{font-size:.7rem;letter-spacing:.1em}
  .cap-foot-text p{font-size:.76rem;white-space:normal;overflow:visible;line-height:1.35}
  .btn-cap-foot-enquire{padding:9px 16px;font-size:.68rem}
}
.cat-back{
  position:fixed;left:14px;bottom:calc(14px + var(--foot-h));z-index:20;background:var(--ink);color:var(--paper);
  border:none;border-radius:999px;padding:9px 16px;font-size:.68rem;letter-spacing:.06em;
  text-transform:uppercase;cursor:pointer;transition:background .2s ease;
}
.cat-back:active{background:var(--ink);opacity:.85}
@media (min-width:768px){
  .cat-back{left:20px;bottom:calc(18px + var(--foot-h));padding:10px 18px;font-size:.74rem;letter-spacing:.08em;}
}

/* ================= lightbox ================= */
#capLb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:60;display:none;
  align-items:center;justify-content:center}
#capLb.on{display:flex}
#capLb img{max-width:92vw;max-height:86vh;object-fit:contain}
.cap-lb-close,.cap-lb-nav{
  position:absolute;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);
  color:#fff;border-radius:50%;width:44px;height:44px;cursor:pointer;font-size:1.1rem;
}
.cap-lb-close{top:calc(16px + var(--safe-top));right:16px}
.cap-lb-prev{left:14px;top:50%;transform:translateY(-50%)}
.cap-lb-next{right:14px;top:50%;transform:translateY(-50%)}
.cap-lb-cap{position:absolute;left:0;right:0;bottom:calc(18px + var(--safe-bottom));text-align:center;color:#fff;font-size:.85rem;opacity:.85}

/* ================= enquiry form - opens right here instead of sending you to the home page ================= */
#capEnq{
  position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.6);padding:calc(16px + var(--safe-top)) 16px calc(16px + var(--safe-bottom));
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
#capEnq.on{display:flex}
.enq-card{
  width:100%;max-width:520px;margin:auto;background:var(--paper);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:26px 26px 22px;
  box-shadow:0 30px 80px rgba(0,0,0,.45);
}
.enq-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.enq-head h2{margin:0;font-size:1.25rem;font-weight:600}
.enq-head p{margin:3px 0 0;font-size:.72rem;opacity:.6}
.enq-close{background:none;border:none;color:var(--ink);opacity:.65;cursor:pointer;font-size:.74rem;padding:4px 0;white-space:nowrap}
.enq-close:hover{opacity:1}
.enq-field{margin-bottom:14px}
.enq-field label{display:block;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-bottom:6px}
.enq-field input,.enq-field select,.enq-field textarea{
  width:100%;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:6px;
  padding:10px 12px;font:inherit;font-size:.92rem;
}
.enq-field select option{color:#000}
.enq-field textarea{min-height:110px;resize:vertical}
.enq-field input:focus,.enq-field select:focus,.enq-field textarea:focus{outline:none;border-color:var(--ink)}
.enq-count{font-size:.64rem;opacity:.5;text-align:right;margin-top:4px}
.enq-hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.enq-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.enq-status{font-size:.68rem;letter-spacing:.08em;opacity:.7}
.enq-send{
  background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:999px;
  padding:11px 24px;font:600 .76rem/1 'Inter',system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
}
.enq-send:disabled{opacity:.45;cursor:not-allowed}
@media (max-width:640px){ .enq-card{padding:22px 18px 18px} }

.skip-link{position:absolute;left:12px;top:-64px;z-index:100;background:#fff;color:#000;padding:10px 16px;
  font-weight:600;font-size:.85rem;text-decoration:none;transition:top .15s ease}
.skip-link:focus{top:12px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>
<body>
<a class="skip-link" href="#catview">Skip to categories</a>

<header class="cap-header" id="capHeader">
  <div class="cap-row1">
    <button class="cap-brand" id="capBrand" aria-label="Back to Home">
      <img src="/logo.png" alt="Living Room Labs">
      <span class="cap-brand-text">
        <b>Living Room Labs</b>
        <span id="capTagline" class="mono"></span>
      </span>
    </button>
    <div class="cap-row1-right">
      <div class="cap-links">
        <button type="button" id="capCollective" class="cap-mobile-hide">The Collective ↗</button>
        <a href="#" id="capElsewhere" class="cap-mobile-hide" target="_blank" rel="noopener">Elsewhere ↗</a>
        <button type="button" id="capLampToggle" class="mono" aria-pressed="false" aria-label="Turn the lamp on">☾ Lamp</button>
        <button type="button" id="capEnquire" class="cap-enquire">Enquire ↗</button>
      </div>
    </div>
  </div>
  <nav class="cap-cats" id="capCats" aria-label="Categories"></nav>
</header>

<div id="discover" role="region" aria-label="Featured photos">
  <div class="disc-stage" id="discStage">
    <div class="disc-track" id="discTrack"></div>
    <button class="disc-nav-btn disc-prev" id="discPrev" aria-label="Previous photo">‹</button>
    <button class="disc-nav-btn disc-next" id="discNext" aria-label="Next photo">›</button>
    <button class="disc-pause mono" id="discPause" aria-label="Pause slideshow">❚❚</button>
  </div>
  <div class="disc-caption">
    <div>
      <b id="discTitle" class="mono">Loading…</b>
      <span id="discMeta"></span>
    </div>
    <div class="disc-hint mono">Click a category above, or swipe to browse</div>
  </div>
</div>

<section id="catview" aria-label="Category photos">
  <div class="cat-head">
    <h1 id="catTitle"></h1>
    <p id="catLine"></p>
    <div class="cat-chips" id="catChips"></div>
  </div>
  <div class="cat-grid" id="catGrid"></div>
</section>
<button class="cat-back mono" id="catBack" style="display:none">← Discover</button>

<footer class="cap-foot" id="capFoot">
  <img src="/logo.png" alt="Living Room Labs" class="cap-foot-logo">
  <div class="cap-foot-text">
    <b class="mono" id="capFootHeading">Enquiry</b>
    <p class="mono" id="capFootTagline">Every frame begins with a conversation</p>
  </div>
  <button type="button" class="btn-cap-foot-enquire mono" id="capFootEnquire">Enquire ↗</button>
</footer>

<div id="capLb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="cap-lb-close" id="lbClose" aria-label="Close">✕</button>
  <button class="cap-lb-nav cap-lb-prev" id="lbPrev" aria-label="Previous photo">‹</button>
  <div id="lbStage">
    <img id="lbImgDim" src="" alt="" aria-hidden="true">
    <img id="lbImg" src="" alt="">
    <div id="lampLayer" aria-hidden="true"></div>
  </div>
  <button class="cap-lb-nav cap-lb-next" id="lbNext" aria-label="Next photo">›</button>
  <div class="cap-lb-cap mono" id="lbCap"></div>
</div>

<div id="capEnq" role="dialog" aria-modal="true" aria-labelledby="enqTitle">
  <div class="enq-card">
    <div class="enq-head">
      <div>
        <h2 id="enqTitle">Enquiry</h2>
        <p class="mono">Every frame begins with a conversation.</p>
      </div>
      <button type="button" class="enq-close mono" id="enqClose" aria-label="Close enquiry">[ ESC / CLOSE ]</button>
    </div>
    <form id="enqForm" novalidate>
      <div class="enq-field">
        <label for="enqName">Your Name</label>
        <input type="text" id="enqName" name="name" required maxlength="100" placeholder="Jane Doe" autocomplete="name">
      </div>
      <div class="enq-field">
        <label for="enqEmail">Your Email</label>
        <input type="email" id="enqEmail" name="email" required maxlength="254" placeholder="name@domain.com" autocomplete="email">
      </div>
      <div class="enq-field">
        <label for="enqCat">Shoot Category</label>
        <select id="enqCat" name="category"><option value="General Enquiry">General Enquiry</option></select>
      </div>
      <div class="enq-field" id="enqEventWrap" style="display:none">
        <label for="enqEvent">Event Type</label>
        <input type="text" id="enqEvent" name="eventType" maxlength="80" placeholder="e.g. Birthday, Wedding, Performing Arts">
      </div>
      <div class="enq-field">
        <label for="enqMsg">Shoot Details &amp; Timeline</label>
        <textarea id="enqMsg" name="message" required maxlength="500" placeholder="Tell us what you're shooting, roughly when, and the location."></textarea>
        <div class="enq-count mono"><span id="enqCount">0</span> / 500</div>
      </div>
      <div class="enq-hp" aria-hidden="true">
        <label for="enqWebsite">Leave this field empty</label>
        <input type="text" id="enqWebsite" name="_gotcha" tabindex="-1" autocomplete="off">
      </div>
      <div class="enq-foot">
        <span class="enq-status mono" id="enqStatus" role="status" aria-live="polite">READY</span>
        <button type="submit" class="enq-send" id="enqSend">Send Enquiry &rarr;</button>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  "use strict";
  var DATA = null, PHOTOS = [], NICHES = [];
  var discoverOrder = [], discoverPaused = false;
  /* CSS px/second - same values the homepage uses: faster on phones, where 60px/s felt sluggish */
  function scrollSpeed(){ return window.innerWidth <= 640 ? 92 : 60; }
  var frameEst = 1000/60, scrollPlan = null, autoRaf = null;
  var track, trackLoopW = 0, trackPos = 0, isTouching = false, extAt = 0, manualPauseUntil = 0;
  var currentCat = null, currentEvent = null, lbList = [], lbIdx = 0;
  var openOverlay = null; /* "lb" (photo viewer) | "enq" (enquiry form) | null */
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function $(s,r){ return (r||document).querySelector(s); }
  function $all(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  /* Thumbnail generated by the site's own image pipeline: /images/uploads/<name> -> /images/thumbs/<name>.webp */
  function thumbFor(src){
    var m = /^\/images\/uploads\/([^\/?#]+)$/.exec(src || "");
    return m ? "/images/thumbs/" + m[1] + ".webp" : src;
  }

  /* theme: mirror whatever the homepage lamp is set to. Defaults to light (lamp off) unless
     the user explicitly chose dark before - doesn't follow the device's OS dark-mode setting. */
  try {
    var savedTheme = localStorage.getItem("lrl_theme");
    document.documentElement.setAttribute("data-theme", savedTheme === "dark" ? "dark" : "light");
  } catch(e){}

  /* both bars are measured live (not guessed in CSS), so the photos, captions and buttons always
     clear them exactly - including the phone's home-indicator safe area inside the footer */
  function syncHeaderHeight(){
    var h = document.getElementById("capHeader").offsetHeight;
    document.documentElement.style.setProperty("--header-h", h + "px");
    var f = document.getElementById("capFoot");
    if (f && f.offsetHeight) document.documentElement.style.setProperty("--foot-h", f.offsetHeight + "px");
  }
  syncHeaderHeight();
  window.addEventListener("resize", syncHeaderHeight);
  window.addEventListener("orientationchange", function(){ setTimeout(syncHeaderHeight, 250); });

  fetch("/content.json").then(function(r){ return r.json(); }).then(function(d){
    DATA = d;
    PHOTOS = (d.photos || []).filter(function(p){ return p && p.src; });
    NICHES = d.niches || [];
    boot();
  }).catch(function(err){
    $("#discTitle").textContent = "Could not load photos";
    console.error(err);
  });

  function boot(){
    buildHeader();
    buildDiscover();
    initLamp();
    syncHeaderHeight();
    applyParams();
  }

  /* ---------------- Lamplight: warm glow that follows cursor/finger, dark mode + full photo view only ---------------- */
  function initLamp(){
    var stage = $("#lbStage");
    var lb = $("#capLb");
    var toggle = $("#capLampToggle");
    if (!stage || !lb || !toggle) return;

    var active = false, lastMoveAt = 0;
    /* positions are tracked in PIXELS relative to the photo itself (lbStage), not
       percentages of the whole dark modal - the mask/glow need to align exactly
       with the visible image, which is smaller than the full-screen backdrop. */
    var curX = 0, curY = 0, targetX = 0, targetY = 0, haveStageSize = false;
    var idlePhase = Math.random() * 1000;

    function isDark(){ return document.documentElement.getAttribute("data-theme") === "dark"; }
    function lbOpen(){ return lb.classList.contains("on"); }

    function updateLampVisibility(){
      /* the spotlight only ever shows over a full, still photo - not the moving strip,
         not the grid. Turning the lamp on also parks the carousel (see startAutoScroll). */
      var show = isDark() && lbOpen();
      stage.classList.toggle("lamp-on", show);
      if (show && !active) centerTarget();
    }

    function centerTarget(){
      var r = stage.getBoundingClientRect();
      targetX = r.width / 2; targetY = r.height / 2;
      curX = targetX; curY = targetY;
      haveStageSize = r.width > 0;
    }

    function setTarget(clientX, clientY){
      var r = stage.getBoundingClientRect();
      targetX = Math.max(0, Math.min(r.width, clientX - r.left));
      targetY = Math.max(0, Math.min(r.height, clientY - r.top));
      haveStageSize = r.width > 0;
      lastMoveAt = performance.now();
      active = true;
    }

    /* tracked on the whole modal (lb), not just the small photo, so moving anywhere over
       the dark surrounding area still aims the lamp - it just clamps to the photo's edges */
    lb.addEventListener("mousemove", function(e){ setTarget(e.clientX, e.clientY); }, {passive:true});
    lb.addEventListener("mouseleave", function(){ active = false; });
    lb.addEventListener("touchstart", function(e){
      if (e.touches && e.touches[0]) setTarget(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive:true});
    lb.addEventListener("touchmove", function(e){
      if (e.touches && e.touches[0]) setTarget(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive:true});
    lb.addEventListener("touchend", function(){
      /* leave the glow where the finger was for a moment, then let it drift back to idle -
         there's no hover on mobile, so a hard cut back to centre would look abrupt */
      setTimeout(function(){ active = false; }, 1200);
    }, {passive:true});

    function loop(t){
      requestAnimationFrame(loop);
      if (!stage.classList.contains("lamp-on")) return;
      if (!haveStageSize) centerTarget();
      var now = performance.now();
      var recentlyActive = active || (now - lastMoveAt < 900);
      var r = stage.getBoundingClientRect();
      if (!recentlyActive) {
        if (reduceMotion) { targetX = r.width/2; targetY = r.height/2; }
        else {
          /* idle: gentle organic drift, so the effect still reads on mobile / mouse-less visits
             instead of sitting dead-centre and static the whole time */
          targetX = r.width/2 + Math.sin((t + idlePhase) / 3800) * (r.width * 0.18);
          targetY = r.height/2 + Math.cos((t + idlePhase) / 4600) * (r.height * 0.16);
        }
      }
      var ease = reduceMotion ? 1 : 0.08;
      curX += (targetX - curX) * ease;
      curY += (targetY - curY) * ease;
      stage.style.setProperty("--lx", curX.toFixed(1) + "px");
      stage.style.setProperty("--ly", curY.toFixed(1) + "px");
    }
    requestAnimationFrame(loop);

    toggle.addEventListener("click", function(){
      var nowDark = !isDark();
      document.documentElement.setAttribute("data-theme", nowDark ? "dark" : "light");
      toggle.setAttribute("aria-pressed", String(nowDark));
      toggle.setAttribute("aria-label", nowDark ? "Turn the lamp off" : "Turn the lamp on");
      toggle.textContent = nowDark ? "☀ Lamp" : "☾ Lamp";
      try { localStorage.setItem("lrl_theme", nowDark ? "dark" : "light"); } catch(e){}
      updateLampVisibility();
    });

    if (isDark()) {
      toggle.setAttribute("aria-pressed", "true");
      toggle.setAttribute("aria-label", "Turn the lamp off");
      toggle.textContent = "☀ Lamp";
    }
    updateLampVisibility();

    if (window.MutationObserver) {
      var mo = new MutationObserver(updateLampVisibility);
      mo.observe(lb, { attributes: true, attributeFilter: ["class"] });
    }
    window.__lampRecheck = updateLampVisibility;
    window.__isDark = isDark;
  }

  function buildHeader(){
    var catsHost = $("#capCats");
    catsHost.innerHTML = "";
    NICHES.forEach(function(n){
      var name = (n && n.name) || n;
      var btn = document.createElement("button");
      btn.className = "cap-cat-btn"; btn.type = "button";
      btn.textContent = name;
      btn.setAttribute("data-cat", name);
      btn.addEventListener("click", function(){ showCategory(name); });
      catsHost.appendChild(btn);
    });

    $("#capTagline").textContent = DATA.tagline || "";
    $("#capFootTagline").textContent = "Every frame begins with a conversation";
    $("#capCollective").addEventListener("click", function(){ window.location.href = "/#collective"; });

    var socials = DATA.socials || [];
    var ig = socials.find(function(s){ return /instagram/i.test(s.name||""); }) || socials[0];
    if (ig && ig.url) $("#capElsewhere").href = ig.url;
    else $("#capElsewhere").style.display = "none";

    syncHeaderHeight();
  }

  /* ---------------- discover: continuous flowing carousel with dock magnification ---------------- */
  function buildDiscover(){
    track = $("#discTrack");
    var pool = PHOTOS.filter(function(p){ return p.showInAll !== false; });
    if (!pool.length) pool = PHOTOS;
    discoverOrder = shuffle(pool);

    /* build once, then an identical clone appended after it, so the loop point is invisible
       (the exact technique the homepage strips use). Cards start at a sensible placeholder
       width and are corrected to the photo's REAL pixel aspect ratio once its thumbnail loads -
       the CMS's "ratio" field turned out not to reliably match the actual image, which is what
       was causing photos to be cropped. */
    var loadedCount = 0, totalCount = discoverOrder.length * 2, didInitialCentre = false;
    function settle(){
      var firstCopy = $all('.disc-card[data-copy="0"]', track);
      trackLoopW = firstCopy.length ? (firstCopy[firstCopy.length-1].offsetLeft + firstCopy[firstCopy.length-1].offsetWidth) - firstCopy[0].offsetLeft + 18 : 0;
      if (!trackPos) trackPos = track.scrollLeft = Math.round(trackLoopW/2);
      if (!didInitialCentre && firstCopy.length) {
        /* the very first settle only gets us near the middle of the loop - snap once to
           whichever card actually landed closest, so a specific photo is genuinely
           front-and-centre on arrival rather than an arbitrary offset between two */
        var mid = trackPos + track.clientWidth/2;
        var nearest = nearestCardTo(mid);
        if (nearest) {
          trackPos = Math.round((nearest.offsetLeft + nearest.offsetWidth/2) - track.clientWidth/2);
          track.scrollLeft = trackPos;
          didInitialCentre = true;
        }
      }
      applyDockScale();
    }
    [discoverOrder, discoverOrder].forEach(function(list, copyNum){
      list.forEach(function(p){
        var card = document.createElement("div");
        card.className = "disc-card";
        card.dataset.copy = copyNum;
        card.style.width = "512px"; /* placeholder until the real dimensions are known */
        var img = document.createElement("img");
        img.loading = "eager";
        img.alt = p.alt || p.title || "";
        img.addEventListener("load", function(){
          if (img.naturalWidth && img.naturalHeight) {
            var h = card.offsetHeight;
            card.style.width = Math.round(h * (img.naturalWidth / img.naturalHeight)) + "px";
          }
          loadedCount++;
          if (loadedCount === totalCount || loadedCount === 6) settle();
        });
        img.addEventListener("error", function(){
          if (img.src !== p.src) { img.src = p.src; return; } /* thumbnail missing: fall back to the full photo */
          loadedCount++;
        });
        img.src = thumbFor(p.src);
        card.appendChild(img);
        card.addEventListener("click", function(){ onCardClick(card, p); });
        track.appendChild(card);
      });
    });

    /* start the loop even before every thumbnail has loaded, using the best measurement so far */
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      settle();
      if (!reduceMotion) startAutoScroll();
    }); });
    /* re-settle once more shortly after, once most thumbnails (small WebP files) have arrived */
    setTimeout(settle, 900);

    $("#discPause").addEventListener("click", toggleDiscoverPause);
    $("#discPrev").addEventListener("click", function(){ nudge(-1); });
    $("#discNext").addEventListener("click", function(){ nudge(1); });

    track.addEventListener("touchstart", function(){ isTouching = true; }, {passive:true});
    track.addEventListener("touchend", function(){ isTouching = false; extAt = performance.now(); }, {passive:true});
    track.addEventListener("mousedown", function(){ track.classList.add("grabbing"); });
    window.addEventListener("mouseup", function(){ track.classList.remove("grabbing"); });
    track.addEventListener("scroll", function(){
      applyDockScale();
      updateCaptionFromCenter();
      if (Math.abs(track.scrollLeft - trackPos) > 1.5) { extAt = performance.now(); }
    }, {passive:true});
  }

  function nearestCardTo(x){
    var cards = $all(".disc-card", track);
    var best = null, bestD = Infinity;
    cards.forEach(function(c){
      var cx = c.offsetLeft + c.offsetWidth/2;
      var d = Math.abs(cx - x);
      if (d < bestD) { bestD = d; best = c; }
    });
    return best;
  }

  function onCardClick(card, photo){
    var center = track.scrollLeft + track.clientWidth/2;
    var cardCenter = card.offsetLeft + card.offsetWidth/2;
    if (Math.abs(cardCenter - center) < track.clientWidth * 0.22) {
      lbList = discoverOrder; lbIdx = discoverOrder.indexOf(photo);
      renderLb(); showOverlay("lb"); $("#lbClose").focus();
    } else {
      manualPauseUntil = performance.now() + 4000;
      track.scrollTo({ left: cardCenter - track.clientWidth/2, behavior: "smooth" });
    }
  }

  function nudge(dir){
    manualPauseUntil = performance.now() + 4000;
    var center = track.scrollLeft + track.clientWidth/2;
    var cards = $all(".disc-card", track).sort(function(a,b){ return (a.offsetLeft) - (b.offsetLeft); });
    var currentIdx = 0, bestD = Infinity;
    cards.forEach(function(c, i){
      var d = Math.abs((c.offsetLeft + c.offsetWidth/2) - center);
      if (d < bestD) { bestD = d; currentIdx = i; }
    });
    var targetIdx = currentIdx + dir;
    if (targetIdx < 0) targetIdx = 0;
    if (targetIdx >= cards.length) targetIdx = cards.length - 1;
    var target = cards[targetIdx];
    track.scrollTo({ left: (target.offsetLeft + target.offsetWidth/2) - track.clientWidth/2, behavior: "smooth" });
  }

  /* dock magnification: cheap (no forced layout reads) - uses cached offsetLeft/offsetWidth
     against the live scrollLeft, same "read once, animate via transform" idea as the rest of the site */
  function applyDockScale(){
    if (!track) return;
    var centerX = track.scrollLeft + track.clientWidth/2;
    var half = track.clientWidth/2;
    var cards = $all(".disc-card", track);
    var winner = null, winnerDist = Infinity;
    cards.forEach(function(card){
      var cx = card.offsetLeft + card.offsetWidth/2;
      var dist = Math.abs(cx - centerX);
      var t = Math.min(1, dist / half);
      var scale = 1 - t*0.32;
      card.style.transform = "scale(" + scale.toFixed(3) + ")";
      if (dist < winnerDist) { winnerDist = dist; winner = card; }
    });
    /* exactly one card is ever "the center" one - the single nearest, not everything within
       some pixel band (which could match several adjacent cards on a wide desktop screen) */
    cards.forEach(function(card){ card.classList.toggle("is-center", card === winner); });
  }

  function updateCaptionFromCenter(){
    var centerX = track.scrollLeft + track.clientWidth/2;
    var best = nearestCardTo(centerX);
    if (!best) return;
    var cards = $all(".disc-card", track);
    var idx = cards.indexOf(best) % discoverOrder.length;
    var p = discoverOrder[idx];
    if (p) {
      $("#discTitle").textContent = p.title || "Untitled";
      $("#discMeta").textContent = [p.category, (p.eventTypes||[]).join(", ")].filter(Boolean).join(" · ");
    }
  }

  /* continuous, whole-pixel-per-frame motion - identical technique to the homepage's
     already-tested auto-scroll engine, so it inherits the same smoothness on every screen */
  var lastFrameT = 0, capFrameLog = [], captionThrottle = 0;
  function refreshScrollPlan(){
    var perFrame = scrollSpeed() * frameEst / 1000;
    var plan = perFrame >= 1.5
      ? { px: Math.round(perFrame), every: 1, perFrame: perFrame }
      : { px: 1, every: Math.max(1, Math.round(1/perFrame)), perFrame: perFrame };
    if (!scrollPlan || Math.abs(plan.perFrame - scrollPlan.perFrame)/scrollPlan.perFrame > 0.12) scrollPlan = plan;
  }
  function startAutoScroll(){
    var frameTick = 0;
    function loop(now){
      autoRaf = requestAnimationFrame(loop);
      if (lastFrameT) {
        var dt = now - lastFrameT;
        if (dt > 2 && dt < 60) {
          capFrameLog.push(dt);
          if (capFrameLog.length > 30) capFrameLog.shift();
          if (capFrameLog.length >= 8) {
            var s = capFrameLog.slice().sort(function(a,b){return a-b;});
            frameEst = s[s.length>>1];
          }
        }
      }
      lastFrameT = now;
      refreshScrollPlan();
      frameTick++;
      if (discoverPaused || isTouching || currentCat || openOverlay) return;
      if (window.__isDark && window.__isDark()) return; /* lamp on -> the strip holds still, matching a calm, static room */
      if (manualPauseUntil && now < manualPauseUntil) return;
      if (extAt && now - extAt < 250) return;
      if (frameTick % scrollPlan.every !== 0) return;

      var actual = track.scrollLeft;
      if (Math.abs(actual - trackPos) > 1.5) { trackPos = Math.round(actual); extAt = now; return; }
      trackPos += scrollPlan.px;
      if (trackLoopW > 0 && trackPos >= trackLoopW * 1.5) trackPos -= trackLoopW;
      track.scrollLeft = trackPos;
      applyDockScale();

      captionThrottle++;
      if (captionThrottle > 12) { captionThrottle = 0; updateCaptionFromCenter(); }
      /* note: the scroll listener above also updates the caption immediately for manual nav (arrows/clicks) */
    }
    autoRaf = requestAnimationFrame(loop);
  }

  function pauseThenResume(){
    extAt = performance.now();
  }

  function toggleDiscoverPause(){
    discoverPaused = !discoverPaused;
    $("#discPause").textContent = discoverPaused ? "▶" : "❚❚";
    $("#discPause").setAttribute("aria-label", discoverPaused ? "Resume slideshow" : "Pause slideshow");
  }

  /* ---------------- navigation + history ----------------
     Every screen change goes through these few functions so the phone/browser Back button
     always does the expected thing:
       photo viewer or enquiry form open  -> Back closes it (you stay where you were)
       a category is open                 -> Back returns to Discover
       on Discover                        -> Back leaves the page
     Only leaving Discover adds a history step - switching between categories or event chips
     just updates the current step, so Back never has to walk through every chip you tapped. */
  function histState(){
    var st = window.history.state;
    return (st && st.lrl) ? st : null;
  }
  function updateUrl(cat, ev, push, fromDiscover){
    var url = new URL(window.location.href);
    if (cat) { url.searchParams.set("category", cat); } else { url.searchParams.delete("category"); }
    if (ev) { url.searchParams.set("event", ev); } else { url.searchParams.delete("event"); }
    var st = { lrl: 1, cat: cat || null, ev: ev || null, fromDiscover: !!fromDiscover, overlay: null };
    if (push) { window.history.pushState(st, "", url); }
    else { window.history.replaceState(st, "", url); }
  }

  /* normalise the entry we arrived on (also clears a stale "viewer open" flag left by a page reload) */
  (function(){
    var params = new URLSearchParams(window.location.search);
    var st = histState();
    var cat = params.get("category");
    updateUrl(cat, params.get("event"), false, !!(cat && st && st.fromDiscover));
  })();

  /* ---------------- category grid ---------------- */
  /* mode: undefined = normal click (adds a history step only when leaving Discover),
           "replace" = update the current step, "none" = don't touch history (Back/Forward itself) */
  function showCategory(name, eventFilter, mode){
    var wasOnDiscover = !currentCat;
    currentCat = name; currentEvent = eventFilter || null;
    document.documentElement.classList.add("cat-open");
    if (window.__lampRecheck) window.__lampRecheck();
    $("#discover").style.display = "none";
    $("#catview").classList.add("on");
    $("#catBack").style.display = "block";
    $all(".cap-cat-btn").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-cat") === name); });

    var nicheInfo = NICHES.find(function(n){ return (n.name||n) === name; }) || {};
    $("#catTitle").textContent = name;
    $("#catLine").textContent = nicheInfo.line || "";

    var catPhotos = PHOTOS.filter(function(p){ return p.category === name; });

    var chipsHost = $("#catChips");
    chipsHost.innerHTML = "";
    var eventTypes = [];
    catPhotos.forEach(function(p){ (p.eventTypes||[]).forEach(function(et){ if (eventTypes.indexOf(et) === -1) eventTypes.push(et); }); });
    if (eventTypes.length) {
      var allChip = document.createElement("button");
      allChip.type = "button";
      allChip.className = "cat-chip mono" + (!currentEvent ? " active" : "");
      allChip.textContent = "All " + name;
      allChip.addEventListener("click", function(){ showCategory(name, null); });
      chipsHost.appendChild(allChip);
      eventTypes.forEach(function(et){
        var chip = document.createElement("button");
        chip.type = "button";
        chip.className = "cat-chip mono" + (currentEvent === et ? " active" : "");
        chip.textContent = et;
        chip.addEventListener("click", function(){ showCategory(name, et); });
        chipsHost.appendChild(chip);
      });
    }

    var visible = currentEvent ? catPhotos.filter(function(p){ return (p.eventTypes||[]).indexOf(currentEvent) > -1; }) : catPhotos;
    renderGrid(visible);

    if (mode !== "none") {
      var push = (mode !== "replace") && wasOnDiscover;
      var prev = histState();
      updateUrl(name, currentEvent, push, push || !!(prev && prev.fromDiscover));
    }
    $("#catview").scrollTop = 0;
    syncHeaderHeight();
  }

  function renderGrid(list){
    lbList = list;
    var grid = $("#catGrid");
    grid.innerHTML = "";
    if (!list.length) {
      grid.innerHTML = '<div class="cat-empty mono">No photos here yet.</div>';
      return;
    }
    list.forEach(function(p, i){
      var card = document.createElement("div");
      card.className = "cat-card";
      card.innerHTML = '<img loading="lazy" src="'+esc(p.src)+'" alt="'+esc(p.alt||p.title||"")+'" style="object-position:'+esc((p.imagePosition||"center").toLowerCase())+'">'+
        '<div class="cc-cap">'+esc(p.title||"")+(p.client?' <span style="opacity:.7">— '+esc(p.client)+'</span>':'')+'</div>';
      card.addEventListener("click", function(){ lbList = list; lbIdx = i; renderLb(); showOverlay("lb"); $("#lbClose").focus(); });
      grid.appendChild(card);
    });
  }

  function backToDiscover(mode){
    currentCat = null; currentEvent = null;
    document.documentElement.classList.remove("cat-open");
    $("#catview").classList.remove("on");
    $("#catBack").style.display = "none";
    $("#discover").style.display = "";   /* back to the stylesheet's flex layout (was forced to "block") */
    $all(".cap-cat-btn").forEach(function(b){ b.classList.remove("active"); });
    if (mode !== "none") updateUrl(null, null, false, false);
    syncHeaderHeight();
    applyDockScale();
    if (window.__lampRecheck) window.__lampRecheck();
  }

  /* "← Discover" / Escape: if we got here from Discover, step Back (so the history stays tidy);
     if you arrived straight on a category link, just switch to Discover in place */
  function goDiscover(){
    var st = histState();
    if (st && st.fromDiscover && st.cat) window.history.back();
    else backToDiscover("replace");
  }
  $("#catBack").addEventListener("click", goDiscover);

  /* ---------------- overlays (photo viewer + enquiry form) ---------------- */
  function overlayEl(name){ return name === "lb" ? $("#capLb") : $("#capEnq"); }
  function showOverlay(name){
    if (openOverlay && openOverlay !== name) hideOverlayUI(openOverlay);
    var el = overlayEl(name);
    var wasOpen = el.classList.contains("on");
    el.classList.add("on");
    openOverlay = name;
    if (!wasOpen) {
      var st = histState() || { cat: currentCat, ev: currentEvent, fromDiscover: false };
      window.history.pushState({ lrl: 1, cat: st.cat || null, ev: st.ev || null, fromDiscover: !!st.fromDiscover, overlay: name }, "", window.location.href);
    }
  }
  function hideOverlayUI(name){
    overlayEl(name).classList.remove("on");
    if (openOverlay === name) openOverlay = null;
  }
  function closeOverlay(name){
    var st = histState();
    if (st && st.overlay === name && openOverlay === name) window.history.back(); /* popstate below hides it */
    else hideOverlayUI(name);
  }

  window.addEventListener("popstate", function(){
    var st = histState();
    /* Back while the viewer / enquiry is open: just close it - the page underneath is unchanged */
    if (openOverlay && !(st && st.overlay === openOverlay)) {
      hideOverlayUI(openOverlay);
      return;
    }
    /* Forward onto an old "overlay open" step: nothing to show there, step straight back off it */
    if (st && st.overlay && !openOverlay) { window.history.back(); return; }

    var params = new URLSearchParams(window.location.search);
    var cat = params.get("category");
    var ev = params.get("event") || null;
    if (cat) {
      if (cat !== currentCat || ev !== currentEvent) showCategory(cat, ev, "none");
    } else if (currentCat) {
      backToDiscover("none");
    }
  });

  /* ---------------- lightbox ---------------- */
  function renderLb(){
    var p = lbList[lbIdx];
    if (!p) return;
    $("#lbImg").src = p.src;
    $("#lbImg").alt = p.alt || p.title || "";
    $("#lbImgDim").src = p.src;
    $("#lbCap").textContent = [p.title, p.caption].filter(Boolean).join(" — ");
  }
  function closeLb(){ closeOverlay("lb"); }
  $("#lbClose").addEventListener("click", closeLb);
  $("#lbPrev").addEventListener("click", function(){ if (!lbList.length) return; lbIdx = (lbIdx - 1 + lbList.length) % lbList.length; renderLb(); });
  $("#lbNext").addEventListener("click", function(){ if (!lbList.length) return; lbIdx = (lbIdx + 1) % lbList.length; renderLb(); });
  $("#capLb").addEventListener("click", function(e){ if (e.target.id === "capLb") closeLb(); });

  /* ---------------- enquiry form (opens right here - no trip to the home page) ---------------- */
  var enqOpenedAt = 0, enqWarned = false, enqSentAt = 0, enqBusy = false, enqDownOnBackdrop = false;
  var DEFAULT_CATS = ["Food", "Pets", "Real Estate", "Products", "Events", "Portraits", "Travel"];

  function fillEnqCategories(){
    var sel = $("#enqCat");
    var keep = sel.value;
    var cats = ["General Enquiry"];
    var source = NICHES.length ? NICHES : DEFAULT_CATS;
    source.forEach(function(n){
      var nm = (n && n.name) || n;
      if (nm && cats.indexOf(nm) === -1) cats.push(nm);
    });
    sel.innerHTML = cats.map(function(c){ return '<option value="'+esc(c)+'">'+esc(c)+'</option>'; }).join("");
    if (cats.indexOf(keep) > -1) sel.value = keep;
  }
  function syncEnqEvent(){
    $("#enqEventWrap").style.display = $("#enqCat").value === "Events" ? "" : "none";
  }
  function openEnquiry(){
    fillEnqCategories();
    var sel = $("#enqCat");
    var want = currentCat || "General Enquiry";
    var has = Array.prototype.some.call(sel.options, function(o){ return o.value === want; });
    if (!has) {
      var opt = document.createElement("option");
      opt.value = want; opt.textContent = want;
      sel.appendChild(opt);
    }
    sel.value = want;
    if (currentEvent) $("#enqEvent").value = currentEvent;
    syncEnqEvent();
    enqOpenedAt = Date.now(); enqWarned = false;
    if (!enqBusy) $("#enqStatus").textContent = "READY";
    showOverlay("enq");
    setTimeout(function(){ $("#enqName").focus(); }, 80);
  }

  $("#capEnquire").addEventListener("click", openEnquiry);
  $("#capFootEnquire").addEventListener("click", openEnquiry);
  $("#capBrand").addEventListener("click", function(){ window.location.href = "/"; });
  $("#enqClose").addEventListener("click", function(){ closeOverlay("enq"); });
  $("#enqCat").addEventListener("change", syncEnqEvent);
  $("#enqMsg").addEventListener("input", function(){ $("#enqCount").textContent = String(this.value.length); });
  /* only a click that STARTS and ends on the dark backdrop closes it - dragging to select text
     inside a field and releasing outside the card won't throw away what you typed */
  $("#capEnq").addEventListener("mousedown", function(e){ enqDownOnBackdrop = (e.target.id === "capEnq"); });
  $("#capEnq").addEventListener("click", function(e){
    if (e.target.id === "capEnq" && enqDownOnBackdrop) closeOverlay("enq");
    enqDownOnBackdrop = false;
  });

  $("#enqForm").addEventListener("submit", function(e){
    e.preventDefault();
    if (enqBusy) return;
    var form = this, status = $("#enqStatus"), send = $("#enqSend");
    if (form.reportValidity && !form.reportValidity()) return; /* browser's own "please fill this in" hints */

    /* same quiet spam checks as the home page form */
    if ($("#enqWebsite").value) { status.textContent = "ENQUIRY SENT // WE REPLY WITHIN 24H"; return; }
    var now = Date.now();
    if (now - enqOpenedAt < 4000 && !enqWarned) {
      enqWarned = true;
      status.textContent = "PLEASE DOUBLE-CHECK, THEN PRESS SEND AGAIN";
      return;
    }
    if (enqSentAt && now - enqSentAt < 30000) { status.textContent = "ALREADY SENT // PLEASE WAIT A MOMENT"; return; }

    var cat = $("#enqCat").value;
    var ev = cat === "Events" ? $("#enqEvent").value.trim() : "";
    var payload = {
      name: $("#enqName").value.trim(),
      email: $("#enqEmail").value.trim(),
      category: cat,
      message: $("#enqMsg").value.trim(),
      _gotcha: ""
    };
    if (ev) payload.eventType = ev;

    enqBusy = true; send.disabled = true;
    status.textContent = "TRANSMITTING...";
    var formId = (DATA && DATA.formspreeId) || "xjykvnoz";

    fetch("https://formspree.io/f/" + formId, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(payload)
    }).then(function(res){
      if (!res.ok) throw new Error("Submission failed (" + res.status + ")");
      enqSentAt = Date.now();
      status.textContent = "ENQUIRY SENT // WE REPLY WITHIN 24H";
      setTimeout(function(){
        form.reset();
        $("#enqCount").textContent = "0";
        syncEnqEvent();
        enqBusy = false; send.disabled = false;
        status.textContent = "READY";
        closeOverlay("enq");
      }, 1800);
    }).catch(function(){
      /* keep the form open with everything typed, and hand off to the mail app as a backup */
      status.textContent = "OPENING YOUR MAIL APP...";
      enqBusy = false; send.disabled = false;
      var to = (DATA && DATA.email) || "hello@livingroomlabs.in";
      window.location.href = "mailto:" + to +
        "?subject=" + encodeURIComponent("Enquiry: " + payload.category + (ev ? " (" + ev + ")" : "") + " — " + payload.name) +
        "&body=" + encodeURIComponent("Name: " + payload.name + "\nEmail: " + payload.email + "\nCategory: " + payload.category +
          (ev ? "\nEvent type: " + ev : "") + "\n\nMessage:\n" + payload.message);
    });
  });

  /* ---------------- keyboard ---------------- */
  document.addEventListener("keydown", function(e){
    if (openOverlay === "enq") {
      if (e.key === "Escape") closeOverlay("enq");
      return; /* arrows etc. belong to the form fields while it's open */
    }
    if (openOverlay === "lb") {
      if (e.key === "Escape") closeLb();
      else if (e.key === "ArrowLeft") $("#lbPrev").click();
      else if (e.key === "ArrowRight") $("#lbNext").click();
      return;
    }
    if (e.key === "Escape" && currentCat) { goDiscover(); return; }
    if (!currentCat && track) {
      if (e.key === "ArrowLeft") nudge(-1);
      else if (e.key === "ArrowRight") nudge(1);
    }
  });

  /* ---------------- url params (footer Events links, shared links, reloads) ---------------- */
  function applyParams(){
    var params = new URLSearchParams(window.location.search);
    var cat = params.get("category");
    var ev = params.get("event");
    if (cat) showCategory(cat, ev || null, "none");
  }
})();
</script>
