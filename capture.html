:root{
  --paper:#FFFFFF; --ink:#000000; --dim:rgba(0,0,0,.55); --line:rgba(0,0,0,.12);
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  --header-h:118px;
}
html[data-theme="dark"]{ --paper:#080808; --ink:#FFFFFF; --dim:rgba(255,255,255,.6); --line:rgba(255,255,255,.14); }
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;background:#050505;color:#fff;overflow:hidden;
  font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace}

/* ================= header ================= */
.cap-header{
  position:fixed;top:0;left:0;right:0;z-index:40;
  padding:calc(12px + var(--safe-top)) 20px 10px;
  background:linear-gradient(180deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.35) 70%,rgba(0,0,0,0) 100%);
}
.cap-row1{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}
.cap-brand{display:flex;align-items:center;gap:12px;background:none;border:none;cursor:pointer;padding:0}
.cap-brand img{width:46px;height:46px;object-fit:contain;filter:brightness(0) invert(1)}
.cap-brand-text{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.cap-brand-text b{font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;color:#fff;font-weight:600}
.cap-brand-text span{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6)}

.cap-row1-right{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:flex-end}
.cap-links{display:flex;gap:16px;align-items:center}
.cap-links a,.cap-links button{
  background:none;border:none;color:#fff;opacity:.85;font-size:.72rem;letter-spacing:.1em;
  text-transform:uppercase;cursor:pointer;text-decoration:none;padding:0;white-space:nowrap;
}
.cap-links a:hover,.cap-links button:hover{opacity:1;text-decoration:underline}
.cap-enquire{
  background:#fff;color:#000 !important;border-radius:999px;padding:7px 16px !important;
  opacity:1 !important;text-decoration:none !important;font-weight:600;
}
.cap-enquire:hover{background:#e8e8e8}

.cap-cats{display:flex;gap:6px;flex-wrap:wrap}
.cap-cat-btn{
  background:none;border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:999px;
  padding:6px 14px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
  transition:background .15s,border-color .15s;white-space:nowrap;
}
.cap-cat-btn:hover,.cap-cat-btn:focus-visible{border-color:#fff}
.cap-cat-btn.active{background:#fff;color:#000;border-color:#fff}

@media (max-width:860px){
  .cap-header{padding:calc(10px + var(--safe-top)) 14px 10px}
  .cap-row1{margin-bottom:8px}
  .cap-brand img{width:38px;height:38px}
  .cap-brand-text{display:none}
  .cap-mobile-hide{display:none !important}
  .cap-cats{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;-webkit-overflow-scrolling:touch;justify-content:flex-start}
  .cap-cats::-webkit-scrollbar{display:none}
}

/* ================= discover: continuous flowing carousel ================= */
#discover{position:fixed;inset:0;background:#050505;display:flex;flex-direction:column}
.disc-stage{
  flex:1;position:relative;overflow:hidden;
  padding-top:var(--header-h);
}
.disc-track{
  position:relative;width:100%;height:100%;display:flex;align-items:center;gap:18px;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;cursor:grab;padding:0 4px;
}
.disc-track::-webkit-scrollbar{display:none}
.disc-track.grabbing{cursor:grabbing}
.disc-card{
  position:relative;flex:0 0 auto;height:min(64vh,640px);border-radius:6px;overflow:hidden;
  cursor:pointer;background:#111;box-shadow:0 24px 60px rgba(0,0,0,.55);
  transform:scale(.7);opacity:.4;filter:brightness(.6);
  transform-origin:center center;will-change:transform,opacity;
}
.disc-card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.disc-card.is-center{cursor:zoom-in}

.disc-caption{
  position:absolute;left:0;right:0;bottom:0;z-index:2;padding:18px 24px calc(16px + var(--safe-bottom));
  background:linear-gradient(0deg,rgba(0,0,0,.75) 0%,rgba(0,0,0,0) 100%);
  display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none;
}
.disc-caption b{display:block;font-size:1rem;font-weight:600}
.disc-caption span{display:block;font-size:.78rem;opacity:.75;margin-top:2px}
.disc-hint{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;opacity:.55;text-align:right}

.disc-nav-btn{
  position:absolute;top:50%;transform:translateY(-50%);z-index:200;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.28);color:#fff;
  width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:1.15rem;
  opacity:0;transition:opacity .2s ease,background .2s ease;
}
.disc-stage:hover .disc-nav-btn{opacity:.85}
.disc-nav-btn:hover{background:rgba(0,0,0,.6);opacity:1 !important}
.disc-prev{left:14px}
.disc-next{right:14px}
@media (max-width:860px){ .disc-nav-btn{opacity:.6} .disc-card{height:52vh} }

.disc-pause{
  position:absolute;right:18px;bottom:calc(70px + var(--safe-bottom));z-index:200;
  background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.3);color:#fff;
  width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:.85rem;
}

#capLampToggle{
  border:1px solid rgba(255,255,255,.3) !important;border-radius:999px;padding:6px 14px !important;
  opacity:.9 !important;text-decoration:none !important;font-size:.7rem !important;
}
#capLampToggle[aria-pressed="true"]{background:rgba(255,196,75,.16);border-color:rgba(255,196,75,.55) !important;color:#ffe9c2 !important}

/* ================= Lamplight: a warm glow that follows the cursor / your finger,
   only in dark mode, only inside the full-screen photo viewer - matching the original
   concept board (a still, full photo with a cursor lamp), not the moving strip.
   Purely additive light on top of the photo - never dims or hides it, and never
   blocks clicks, swipes or the prev/next/close buttons. */
#lampLayer{
  position:absolute;inset:0;z-index:35;pointer-events:none;opacity:0;
  transition:opacity .5s ease;
  background:
    radial-gradient(520px circle at var(--lx,50%) var(--ly,50%), rgba(255,196,110,.22), transparent 60%),
    radial-gradient(950px circle at var(--lx,50%) var(--ly,50%), rgba(0,0,0,0) 40%, rgba(0,0,0,.5) 100%);
  mix-blend-mode:screen;
}
html[data-theme="dark"] #lampLayer.on{opacity:1}
@media (max-width:860px){
  #lampLayer{
    background:
      radial-gradient(320px circle at var(--lx,50%) var(--ly,42%), rgba(255,196,110,.24), transparent 62%),
      radial-gradient(600px circle at var(--lx,50%) var(--ly,42%), rgba(0,0,0,0) 42%, rgba(0,0,0,.48) 100%);
  }
}
@media (prefers-reduced-motion:reduce){ #lampLayer{transition:opacity .2s ease} }

/* ================= category grid view ================= */
#catview{position:fixed;inset:0;background:var(--paper);color:var(--ink);overflow-y:auto;display:none;
  padding-top:calc(var(--header-h) + 18px);-webkit-overflow-scrolling:touch}
html[data-theme="dark"] #catview{background:#080808;color:#fff}
#catview.on{display:block}
.cat-head{padding:0 24px 18px;max-width:1400px;margin:0 auto}
.cat-head h1{font-size:clamp(1.6rem,4vw,2.4rem);margin:0 0 6px;font-weight:600}
.cat-head p{margin:0;opacity:.6;font-size:.9rem;max-width:56ch}
.cat-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.cat-chip{
  border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;
  padding:6px 14px;font-size:.74rem;letter-spacing:.05em;cursor:pointer;text-transform:uppercase;
}
.cat-chip.active{background:var(--ink);color:var(--paper)}
.cat-grid{
  max-width:1400px;margin:0 auto;padding:8px 20px 60px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;
}
.cat-card{position:relative;border-radius:2px;overflow:hidden;cursor:pointer;background:#111;aspect-ratio:4/5}
.cat-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.cat-card:hover img{transform:scale(1.04)}
.cat-card .cc-cap{
  position:absolute;left:0;right:0;bottom:0;padding:10px 12px;
  background:linear-gradient(0deg,rgba(0,0,0,.75),rgba(0,0,0,0));color:#fff;
  opacity:0;transition:opacity .2s ease;font-size:.78rem;
}
.cat-card:hover .cc-cap{opacity:1}
.cat-empty{opacity:.55;padding:40px 24px;text-align:center}
.cat-back{
  position:fixed;left:20px;bottom:24px;z-index:20;background:var(--ink);color:var(--paper);
  border:none;border-radius:999px;padding:10px 18px;font-size:.74rem;letter-spacing:.08em;
  text-transform:uppercase;cursor:pointer;
}

/* ================= lightbox ================= */
#capLb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:60;display:none;
  align-items:center;justify-content:center}
#capLb.on{display:flex}
#capLb img{max-width:92vw;max-height:86vh;object-fit:contain}
.cap-lb-close,.cap-lb-nav{
  position:absolute;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);
  color:#fff;border-radius:50%;width:44px;height:44px;cursor:pointer;font-size:1.1rem;
}
.cap-lb-close{top:calc(16px + var(--safe-top));right:16px}
.cap-lb-prev{left:14px;top:50%;transform:translateY(-50%)}
.cap-lb-next{right:14px;top:50%;transform:translateY(-50%)}
.cap-lb-cap{position:absolute;left:0;right:0;bottom:calc(18px + var(--safe-bottom));text-align:center;color:#fff;font-size:.85rem;opacity:.85}

.skip-link{position:absolute;left:12px;top:-64px;z-index:100;background:#fff;color:#000;padding:10px 16px;
  font-weight:600;font-size:.85rem;text-decoration:none;transition:top .15s ease}
.skip-link:focus{top:12px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>
<body>
<a class="skip-link" href="#catview">Skip to categories</a>

<header class="cap-header" id="capHeader">
  <div class="cap-row1">
    <button class="cap-brand" id="capBrand" aria-label="Back to Home">
      <img src="/logo.png" alt="Living Room Labs">
      <span class="cap-brand-text">
        <b>Living Room Labs</b>
        <span id="capTagline" class="mono"></span>
      </span>
    </button>
    <div class="cap-row1-right">
      <div class="cap-links">
        <button type="button" id="capCollective">The Collective ↗</button>
        <a href="#" id="capElsewhere" class="cap-mobile-hide" target="_blank" rel="noopener">Elsewhere ↗</a>
        <button type="button" id="capLampToggle" class="mono" aria-pressed="false" aria-label="Turn the lamp on">☾ Lamp</button>
        <button type="button" id="capEnquire" class="cap-enquire">Enquire ↗</button>
      </div>
    </div>
  </div>
  <nav class="cap-cats" id="capCats" aria-label="Categories"></nav>
</header>

<div id="discover" role="region" aria-label="Featured photos">
  <div class="disc-stage" id="discStage">
    <div class="disc-track" id="discTrack"></div>
    <button class="disc-nav-btn disc-prev" id="discPrev" aria-label="Previous photo">‹</button>
    <button class="disc-nav-btn disc-next" id="discNext" aria-label="Next photo">›</button>
    <button class="disc-pause mono" id="discPause" aria-label="Pause slideshow">❚❚</button>
  </div>
  <div class="disc-caption">
    <div>
      <b id="discTitle" class="mono">Loading…</b>
      <span id="discMeta"></span>
    </div>
    <div class="disc-hint mono">Click a category above, or swipe to browse</div>
  </div>
</div>

<section id="catview" aria-label="Category photos">
  <div class="cat-head">
    <h1 id="catTitle"></h1>
    <p id="catLine"></p>
    <div class="cat-chips" id="catChips"></div>
  </div>
  <div class="cat-grid" id="catGrid"></div>
</section>
<button class="cat-back mono" id="catBack" style="display:none">← Discover</button>

<div id="capLb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="cap-lb-close" id="lbClose" aria-label="Close">✕</button>
  <button class="cap-lb-nav cap-lb-prev" id="lbPrev" aria-label="Previous photo">‹</button>
  <img id="lbImg" src="" alt="">
  <button class="cap-lb-nav cap-lb-next" id="lbNext" aria-label="Next photo">›</button>
  <div class="cap-lb-cap mono" id="lbCap"></div>
  <div id="lampLayer" aria-hidden="true"></div>
</div>

<script>
(function(){
  "use strict";
  var DATA = null, PHOTOS = [], NICHES = [];
  var discoverOrder = [], discoverPaused = false;
  var SCROLL_SPEED = 60;               /* CSS px/second - same value the homepage uses, which maps to a clean 1px-per-frame step at 60Hz with zero skipped frames */
  var frameEst = 1000/60, scrollPlan = null, autoRaf = null;
  var track, trackLoopW = 0, trackPos = 0, isTouching = false, extAt = 0, manualPauseUntil = 0;
  var currentCat = null, currentEvent = null, lbList = [], lbIdx = 0;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function $(s,r){ return (r||document).querySelector(s); }
  function $all(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  /* Thumbnail generated by the site's own image pipeline: /images/uploads/<name> -> /images/thumbs/<name>.webp */
  function thumbFor(src){
    var m = /^\/images\/uploads\/([^\/?#]+)$/.exec(src || "");
    return m ? "/images/thumbs/" + m[1] + ".webp" : src;
  }

  /* theme: mirror whatever the homepage lamp is set to */
  try {
    var savedTheme = localStorage.getItem("lrl_theme");
    if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
  } catch(e){}

  function syncHeaderHeight(){
    var h = document.getElementById("capHeader").offsetHeight;
    document.documentElement.style.setProperty("--header-h", h + "px");
  }
  window.addEventListener("resize", syncHeaderHeight);
  window.addEventListener("orientationchange", function(){ setTimeout(syncHeaderHeight, 250); });

  fetch("/content.json").then(function(r){ return r.json(); }).then(function(d){
    DATA = d;
    PHOTOS = (d.photos || []).filter(function(p){ return p && p.src; });
    NICHES = d.niches || [];
    boot();
  }).catch(function(err){
    $("#discTitle").textContent = "Could not load photos";
    console.error(err);
  });

  function boot(){
    buildHeader();
    buildDiscover();
    initLamp();
    syncHeaderHeight();
    applyParams();
  }

  /* ---------------- Lamplight: warm glow that follows cursor/finger, dark mode + full photo view only ---------------- */
  function initLamp(){
    var layer = $("#lampLayer");
    var lb = $("#capLb");
    var toggle = $("#capLampToggle");
    if (!layer || !lb || !toggle) return;

    var active = false, lastMoveAt = 0;
    var curX = 50, curY = 50, targetX = 50, targetY = 50;
    var idlePhase = Math.random() * 1000;

    function isDark(){ return document.documentElement.getAttribute("data-theme") === "dark"; }
    function lbOpen(){ return lb.classList.contains("on"); }

    function updateLampVisibility(){
      /* the glow itself only ever shows over a full, still photo - not the moving strip,
         not the grid. Turning the lamp on also parks the carousel (see startAutoScroll). */
      layer.classList.toggle("on", isDark() && lbOpen());
    }

    function setTarget(clientX, clientY){
      var r = lb.getBoundingClientRect();
      targetX = Math.max(0, Math.min(100, ((clientX - r.left) / r.width) * 100));
      targetY = Math.max(0, Math.min(100, ((clientY - r.top) / r.height) * 100));
      lastMoveAt = performance.now();
      active = true;
    }

    lb.addEventListener("mousemove", function(e){ setTarget(e.clientX, e.clientY); }, {passive:true});
    lb.addEventListener("mouseleave", function(){ active = false; });
    lb.addEventListener("touchstart", function(e){
      if (e.touches && e.touches[0]) setTarget(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive:true});
    lb.addEventListener("touchmove", function(e){
      if (e.touches && e.touches[0]) setTarget(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive:true});
    lb.addEventListener("touchend", function(){
      /* leave the glow where the finger was for a moment, then let it drift back to idle -
         there's no hover on mobile, so a hard cut back to centre would look abrupt */
      setTimeout(function(){ active = false; }, 1200);
    }, {passive:true});

    function loop(t){
      requestAnimationFrame(loop);
      if (!layer.classList.contains("on")) return;
      var now = performance.now();
      var recentlyActive = active || (now - lastMoveAt < 900);
      if (!recentlyActive) {
        if (reduceMotion) { targetX = 50; targetY = 50; }
        else {
          /* idle: gentle organic drift, so the effect still reads on mobile / mouse-less visits
             instead of sitting dead-centre and static the whole time */
          targetX = 50 + Math.sin((t + idlePhase) / 3800) * 20;
          targetY = 50 + Math.cos((t + idlePhase) / 4600) * 16;
        }
      }
      var ease = reduceMotion ? 1 : 0.08;
      curX += (targetX - curX) * ease;
      curY += (targetY - curY) * ease;
      lb.style.setProperty("--lx", curX.toFixed(2) + "%");
      lb.style.setProperty("--ly", curY.toFixed(2) + "%");
    }
    requestAnimationFrame(loop);

    toggle.addEventListener("click", function(){
      var nowDark = !isDark();
      document.documentElement.setAttribute("data-theme", nowDark ? "dark" : "light");
      toggle.setAttribute("aria-pressed", String(nowDark));
      toggle.setAttribute("aria-label", nowDark ? "Turn the lamp off" : "Turn the lamp on");
      toggle.textContent = nowDark ? "☀ Lamp" : "☾ Lamp";
      try { localStorage.setItem("lrl_theme", nowDark ? "dark" : "light"); } catch(e){}
      updateLampVisibility();
    });

    if (isDark()) {
      toggle.setAttribute("aria-pressed", "true");
      toggle.setAttribute("aria-label", "Turn the lamp off");
      toggle.textContent = "☀ Lamp";
    }
    updateLampVisibility();

    if (window.MutationObserver) {
      var mo = new MutationObserver(updateLampVisibility);
      mo.observe(lb, { attributes: true, attributeFilter: ["class"] });
    }
    window.__lampRecheck = updateLampVisibility;
    window.__isDark = isDark;
  }

  function buildHeader(){
    var catsHost = $("#capCats");
    catsHost.innerHTML = "";
    NICHES.forEach(function(n){
      var name = (n && n.name) || n;
      var btn = document.createElement("button");
      btn.className = "cap-cat-btn"; btn.type = "button";
      btn.textContent = name;
      btn.setAttribute("data-cat", name);
      btn.addEventListener("click", function(){ showCategory(name); });
      catsHost.appendChild(btn);
    });

    $("#capTagline").textContent = DATA.tagline || "";
    $("#capBrand").addEventListener("click", function(){ window.location.href = "/"; });
    $("#capCollective").addEventListener("click", function(){ window.location.href = "/#collective"; });
    $("#capEnquire").addEventListener("click", function(){
      var cat = currentCat || "General Enquiry";
      window.location.href = "/?enquire=" + encodeURIComponent(cat) + "#top";
    });

    var socials = DATA.socials || [];
    var ig = socials.find(function(s){ return /instagram/i.test(s.name||""); }) || socials[0];
    if (ig && ig.url) $("#capElsewhere").href = ig.url;
    else $("#capElsewhere").style.display = "none";

    syncHeaderHeight();
  }

  /* ---------------- discover: continuous flowing carousel with dock magnification ---------------- */
  function buildDiscover(){
    track = $("#discTrack");
    var pool = PHOTOS.filter(function(p){ return p.showInAll !== false; });
    if (!pool.length) pool = PHOTOS;
    discoverOrder = shuffle(pool);

    /* build once, then an identical clone appended after it, so the loop point is invisible
       (the exact technique the homepage strips use). Cards start at a sensible placeholder
       width and are corrected to the photo's REAL pixel aspect ratio once its thumbnail loads -
       the CMS's "ratio" field turned out not to reliably match the actual image, which is what
       was causing photos to be cropped. */
    var loadedCount = 0, totalCount = discoverOrder.length * 2, didInitialCentre = false;
    function settle(){
      var firstCopy = $all('.disc-card[data-copy="0"]', track);
      trackLoopW = firstCopy.length ? (firstCopy[firstCopy.length-1].offsetLeft + firstCopy[firstCopy.length-1].offsetWidth) - firstCopy[0].offsetLeft + 18 : 0;
      if (!trackPos) trackPos = track.scrollLeft = Math.round(trackLoopW/2);
      if (!didInitialCentre && firstCopy.length) {
        /* the very first settle only gets us near the middle of the loop - snap once to
           whichever card actually landed closest, so a specific photo is genuinely
           front-and-centre on arrival rather than an arbitrary offset between two */
        var mid = trackPos + track.clientWidth/2;
        var nearest = nearestCardTo(mid);
        if (nearest) {
          trackPos = Math.round((nearest.offsetLeft + nearest.offsetWidth/2) - track.clientWidth/2);
          track.scrollLeft = trackPos;
          didInitialCentre = true;
        }
      }
      applyDockScale();
    }
    [discoverOrder, discoverOrder].forEach(function(list, copyNum){
      list.forEach(function(p){
        var card = document.createElement("div");
        card.className = "disc-card";
        card.dataset.copy = copyNum;
        card.style.width = "512px"; /* placeholder until the real dimensions are known */
        var img = document.createElement("img");
        img.loading = "eager";
        img.alt = p.alt || p.title || "";
        img.addEventListener("load", function(){
          if (img.naturalWidth && img.naturalHeight) {
            var h = card.offsetHeight;
            card.style.width = Math.round(h * (img.naturalWidth / img.naturalHeight)) + "px";
          }
          loadedCount++;
          if (loadedCount === totalCount || loadedCount === 6) settle();
        });
        img.addEventListener("error", function(){
          if (img.src !== p.src) { img.src = p.src; return; } /* thumbnail missing: fall back to the full photo */
          loadedCount++;
        });
        img.src = thumbFor(p.src);
        card.appendChild(img);
        card.addEventListener("click", function(){ onCardClick(card, p); });
        track.appendChild(card);
      });
    });

    /* start the loop even before every thumbnail has loaded, using the best measurement so far */
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      settle();
      if (!reduceMotion) startAutoScroll();
    }); });
    /* re-settle once more shortly after, once most thumbnails (small WebP files) have arrived */
    setTimeout(settle, 900);

    $("#discPause").addEventListener("click", toggleDiscoverPause);
    $("#discPrev").addEventListener("click", function(){ nudge(-1); });
    $("#discNext").addEventListener("click", function(){ nudge(1); });

    track.addEventListener("touchstart", function(){ isTouching = true; }, {passive:true});
    track.addEventListener("touchend", function(){ isTouching = false; extAt = performance.now(); }, {passive:true});
    track.addEventListener("mousedown", function(){ track.classList.add("grabbing"); });
    window.addEventListener("mouseup", function(){ track.classList.remove("grabbing"); });
    track.addEventListener("scroll", function(){
      applyDockScale();
      updateCaptionFromCenter();
      if (Math.abs(track.scrollLeft - trackPos) > 1.5) { extAt = performance.now(); }
    }, {passive:true});
  }

  function nearestCardTo(x){
    var cards = $all(".disc-card", track);
    var best = null, bestD = Infinity;
    cards.forEach(function(c){
      var cx = c.offsetLeft + c.offsetWidth/2;
      var d = Math.abs(cx - x);
      if (d < bestD) { bestD = d; best = c; }
    });
    return best;
  }

  function onCardClick(card, photo){
    var center = track.scrollLeft + track.clientWidth/2;
    var cardCenter = card.offsetLeft + card.offsetWidth/2;
    if (Math.abs(cardCenter - center) < track.clientWidth * 0.22) {
      lbList = discoverOrder; lbIdx = discoverOrder.indexOf(photo);
      renderLb(); $("#capLb").classList.add("on"); $("#lbClose").focus();
    } else {
      manualPauseUntil = performance.now() + 4000;
      track.scrollTo({ left: cardCenter - track.clientWidth/2, behavior: "smooth" });
    }
  }

  function nudge(dir){
    manualPauseUntil = performance.now() + 4000;
    var center = track.scrollLeft + track.clientWidth/2;
    var cards = $all(".disc-card", track).sort(function(a,b){ return (a.offsetLeft) - (b.offsetLeft); });
    var currentIdx = 0, bestD = Infinity;
    cards.forEach(function(c, i){
      var d = Math.abs((c.offsetLeft + c.offsetWidth/2) - center);
      if (d < bestD) { bestD = d; currentIdx = i; }
    });
    var targetIdx = currentIdx + dir;
    if (targetIdx < 0) targetIdx = 0;
    if (targetIdx >= cards.length) targetIdx = cards.length - 1;
    var target = cards[targetIdx];
    track.scrollTo({ left: (target.offsetLeft + target.offsetWidth/2) - track.clientWidth/2, behavior: "smooth" });
  }

  /* dock magnification: cheap (no forced layout reads) - uses cached offsetLeft/offsetWidth
     against the live scrollLeft, same "read once, animate via transform" idea as the rest of the site */
  function applyDockScale(){
    var centerX = track.scrollLeft + track.clientWidth/2;
    var half = track.clientWidth/2;
    var cards = $all(".disc-card", track);
    var winner = null, winnerDist = Infinity;
    cards.forEach(function(card){
      var cx = card.offsetLeft + card.offsetWidth/2;
      var dist = Math.abs(cx - centerX);
      var t = Math.min(1, dist / half);
      var scale = 1 - t*0.32;
      var opacity = 1 - t*0.62;
      var bright = 1 - t*0.42;
      card.style.transform = "scale(" + scale.toFixed(3) + ")";
      card.style.opacity = opacity.toFixed(3);
      card.style.filter = "brightness(" + bright.toFixed(3) + ")";
      if (dist < winnerDist) { winnerDist = dist; winner = card; }
    });
    /* exactly one card is ever "the center" one - the single nearest, not everything within
       some pixel band (which could match several adjacent cards on a wide desktop screen) */
    cards.forEach(function(card){ card.classList.toggle("is-center", card === winner); });
  }

  function updateCaptionFromCenter(){
    var centerX = track.scrollLeft + track.clientWidth/2;
    var best = nearestCardTo(centerX);
    if (!best) return;
    var cards = $all(".disc-card", track);
    var idx = cards.indexOf(best) % discoverOrder.length;
    var p = discoverOrder[idx];
    if (p) {
      $("#discTitle").textContent = p.title || "Untitled";
      $("#discMeta").textContent = [p.category, (p.eventTypes||[]).join(", ")].filter(Boolean).join(" · ");
    }
  }

  /* continuous, whole-pixel-per-frame motion - identical technique to the homepage's
     already-tested auto-scroll engine, so it inherits the same smoothness on every screen */
  var lastFrameT = 0, capFrameLog = [], captionThrottle = 0;
  function refreshScrollPlan(){
    var perFrame = SCROLL_SPEED * frameEst / 1000;
    var plan = perFrame >= 1.5
      ? { px: Math.round(perFrame), every: 1, perFrame: perFrame }
      : { px: 1, every: Math.max(1, Math.round(1/perFrame)), perFrame: perFrame };
    if (!scrollPlan || Math.abs(plan.perFrame - scrollPlan.perFrame)/scrollPlan.perFrame > 0.12) scrollPlan = plan;
  }
  function startAutoScroll(){
    var frameTick = 0;
    function loop(now){
      autoRaf = requestAnimationFrame(loop);
      if (lastFrameT) {
        var dt = now - lastFrameT;
        if (dt > 2 && dt < 60) {
          capFrameLog.push(dt);
          if (capFrameLog.length > 30) capFrameLog.shift();
          if (capFrameLog.length >= 8) {
            var s = capFrameLog.slice().sort(function(a,b){return a-b;});
            frameEst = s[s.length>>1];
          }
        }
      }
      lastFrameT = now;
      refreshScrollPlan();
      frameTick++;
      if (discoverPaused || isTouching || currentCat) return;
      if (window.__isDark && window.__isDark()) return; /* lamp on -> the strip holds still, matching a calm, static room */
      if (manualPauseUntil && now < manualPauseUntil) return;
      if (extAt && now - extAt < 250) return;
      if (frameTick % scrollPlan.every !== 0) return;

      var actual = track.scrollLeft;
      if (Math.abs(actual - trackPos) > 1.5) { trackPos = Math.round(actual); extAt = now; return; }
      trackPos += scrollPlan.px;
      if (trackLoopW > 0 && trackPos >= trackLoopW * 1.5) trackPos -= trackLoopW;
      track.scrollLeft = trackPos;
      applyDockScale();

      captionThrottle++;
      if (captionThrottle > 12) { captionThrottle = 0; updateCaptionFromCenter(); }
      /* note: the scroll listener above also updates the caption immediately for manual nav (arrows/clicks) */
    }
    autoRaf = requestAnimationFrame(loop);
  }

  function pauseThenResume(){
    extAt = performance.now();
  }

  function toggleDiscoverPause(){
    discoverPaused = !discoverPaused;
    $("#discPause").textContent = discoverPaused ? "▶" : "❚❚";
    $("#discPause").setAttribute("aria-label", discoverPaused ? "Resume slideshow" : "Pause slideshow");
  }

  /* ---------------- category grid ---------------- */
  function showCategory(name, eventFilter){
    currentCat = name; currentEvent = eventFilter || null;
    if (window.__lampRecheck) window.__lampRecheck();
    $("#discover").style.display = "none";
    $("#catview").classList.add("on");
    $("#catBack").style.display = "block";
    $all(".cap-cat-btn").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-cat") === name); });

    var nicheInfo = NICHES.find(function(n){ return (n.name||n) === name; }) || {};
    $("#catTitle").textContent = name;
    $("#catLine").textContent = nicheInfo.line || "";

    var catPhotos = PHOTOS.filter(function(p){ return p.category === name; });

    var chipsHost = $("#catChips");
    chipsHost.innerHTML = "";
    var eventTypes = [];
    catPhotos.forEach(function(p){ (p.eventTypes||[]).forEach(function(et){ if (eventTypes.indexOf(et) === -1) eventTypes.push(et); }); });
    if (eventTypes.length) {
      var allChip = document.createElement("button");
      allChip.className = "cat-chip mono" + (!currentEvent ? " active" : "");
      allChip.textContent = "All " + name;
      allChip.addEventListener("click", function(){ showCategory(name, null); });
      chipsHost.appendChild(allChip);
      eventTypes.forEach(function(et){
        var chip = document.createElement("button");
        chip.className = "cat-chip mono" + (currentEvent === et ? " active" : "");
        chip.textContent = et;
        chip.addEventListener("click", function(){ showCategory(name, et); });
        chipsHost.appendChild(chip);
      });
    }

    var visible = currentEvent ? catPhotos.filter(function(p){ return (p.eventTypes||[]).indexOf(currentEvent) > -1; }) : catPhotos;
    renderGrid(visible);
    updateUrl(name, currentEvent);
    $("#catview").scrollTop = 0;
    syncHeaderHeight();
  }

  function renderGrid(list){
    lbList = list;
    var grid = $("#catGrid");
    grid.innerHTML = "";
    if (!list.length) {
      grid.innerHTML = '<div class="cat-empty mono">No photos here yet.</div>';
      return;
    }
    list.forEach(function(p, i){
      var card = document.createElement("div");
      card.className = "cat-card";
      card.innerHTML = '<img loading="lazy" src="'+esc(p.src)+'" alt="'+esc(p.alt||p.title||"")+'" style="object-position:'+esc((p.imagePosition||"center").toLowerCase())+'">'+
        '<div class="cc-cap">'+esc(p.title||"")+(p.client?' <span style="opacity:.7">— '+esc(p.client)+'</span>':'')+'</div>';
      card.addEventListener("click", function(){ lbList = list; lbIdx = i; renderLb(); $("#capLb").classList.add("on"); $("#lbClose").focus(); });
      grid.appendChild(card);
    });
  }

  function backToDiscover(){
    currentCat = null; currentEvent = null;
    $("#catview").classList.remove("on");
    $("#catBack").style.display = "none";
    $("#discover").style.display = "block";
    $all(".cap-cat-btn").forEach(function(b){ b.classList.remove("active"); });
    updateUrl(null, null);
    applyDockScale();
    if (window.__lampRecheck) window.__lampRecheck();
  }
  $("#catBack").addEventListener("click", backToDiscover);

  /* ---------------- lightbox ---------------- */
  function renderLb(){
    var p = lbList[lbIdx];
    if (!p) return;
    $("#lbImg").src = p.src;
    $("#lbImg").alt = p.alt || p.title || "";
    $("#lbCap").textContent = [p.title, p.caption].filter(Boolean).join(" — ");
  }
  function closeLb(){ $("#capLb").classList.remove("on"); }
  $("#lbClose").addEventListener("click", closeLb);
  $("#lbPrev").addEventListener("click", function(){ lbIdx = (lbIdx - 1 + lbList.length) % lbList.length; renderLb(); });
  $("#lbNext").addEventListener("click", function(){ lbIdx = (lbIdx + 1) % lbList.length; renderLb(); });
  $("#capLb").addEventListener("click", function(e){ if (e.target.id === "capLb") closeLb(); });

  document.addEventListener("keydown", function(e){
    if ($("#capLb").classList.contains("on")) {
      if (e.key === "Escape") closeLb();
      else if (e.key === "ArrowLeft") $("#lbPrev").click();
      else if (e.key === "ArrowRight") $("#lbNext").click();
      return;
    }
    if (e.key === "Escape" && currentCat) { backToDiscover(); return; }
    if (!currentCat) {
      if (e.key === "ArrowLeft") nudge(-1);
      else if (e.key === "ArrowRight") nudge(1);
    }
  });

  /* ---------------- url params (for footer Events links) ---------------- */
  function applyParams(){
    var params = new URLSearchParams(window.location.search);
    var cat = params.get("category");
    var ev = params.get("event");
    if (cat) showCategory(cat, ev || null);
  }
  function updateUrl(cat, ev){
    var url = new URL(window.location.href);
    if (cat) { url.searchParams.set("category", cat); } else { url.searchParams.delete("category"); }
    if (ev) { url.searchParams.set("event", ev); } else { url.searchParams.delete("event"); }
    window.history.replaceState({}, "", url);
  }
})();
</script>
</body>
</html>
