<!-- Light / dark follows whatever was chosen on the home page (the lamp cord), set before first
     paint so nothing flashes. Spotlight is a separate switch and always starts off. -->
<script>
  (function(){
    try {
      var dark = localStorage.getItem("lrl_theme") === "dark";
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      var tcm = document.getElementById("themeColorMeta");
      if (tcm) tcm.setAttribute("content", dark ? "#080808" : "#FFFFFF");
    } catch(e) {}
  })();
</script>
<script>
  /* Marks each grid/carousel photo "loaded" the instant it finishes downloading, so the CSS
     above can settle it from a soft blur into focus. Capture phase, because "load" doesn't
     bubble - catches every photo however and whenever it's created, cache included. */
  (function () {
    try {
      document.addEventListener("load", function (e) {
        var img = e.target;
        if (img && img.tagName === "IMG") img.classList.add("lrl-loaded");
      }, true);
    } catch (e) {}
  })();
</script>

:root{
  --paper:#FFFFFF; --ink:#000000; --dim:rgba(0,0,0,.55); --line:rgba(0,0,0,.12);
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  --header-h:118px; --foot-h:106px;
}
html[data-theme="dark"]{ --paper:#080808; --ink:#FFFFFF; --dim:rgba(255,255,255,.6); --line:rgba(255,255,255,.14); }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0;height:100%;background:#050505;color:#fff;overflow:hidden;
  font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace}

/* ================= header ================= */
.cap-header{
  position:fixed;top:0;left:0;right:0;z-index:40;
  padding:calc(12px + var(--safe-top)) 20px 10px;
  background:linear-gradient(180deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.35) 70%,rgba(0,0,0,0) 100%);
}
.cap-row1{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px}
.cap-brand{display:flex;align-items:center;gap:12px;background:none;border:none;cursor:pointer;padding:0}
/* logo: shown with its empty see-through margins trimmed (see shared.js), so the visible artwork IS the box */
.lg-crop{display:block;overflow:hidden;aspect-ratio:var(--lg-ar,1.4649);line-height:0;flex:none}
.lg-crop > img{display:block;max-width:none;width:var(--lg-w,106.383%);height:auto;margin:var(--lg-t,-20.035%) 0 0 var(--lg-l,-3.191%)}
.cap-brand .lg-crop{height:44px;width:calc(44px * var(--lg-ar,1.4649));view-transition-name:lrl-logo}

/* page-to-page: short cross-fade with the home page, logo glides into place (see index.html) */
@view-transition{navigation:auto}
@media (prefers-reduced-motion:reduce){ @view-transition{navigation:none} }
::view-transition-old(root),::view-transition-new(root){animation-duration:.26s}
::view-transition-group(lrl-logo){animation-duration:.34s;animation-timing-function:cubic-bezier(.16,1,.3,1)}

/* "View" tag that follows the mouse over photos (desktop mouse only) */
.lrl-view-tag{position:fixed;left:0;top:0;z-index:9500;pointer-events:none;
  padding:7px 12px 6px;border-radius:999px;background:rgba(10,10,10,.84);color:#fff;
  font:600 .6rem/1 'JetBrains Mono',monospace;letter-spacing:.18em;text-transform:uppercase;
  opacity:0;scale:.8;translate:-200px -200px;transition:opacity .16s ease,scale .2s cubic-bezier(.16,1,.3,1);will-change:translate}
.lrl-view-tag.on{opacity:1;scale:1}
html[data-theme="dark"] .lrl-view-tag{background:rgba(255,255,255,.92);color:#0a0a0a}
@media (prefers-reduced-motion:reduce){ .lrl-view-tag{transition:none} }
.cap-brand img{filter:brightness(0) invert(1)}
.cap-brand-text{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.cap-brand-text b{font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;color:#fff;font-weight:600}
.cap-brand-text span{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6)}

.cap-row1-right{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:flex-end}
.cap-links{display:flex;gap:16px;align-items:center}
.cap-links a,.cap-links button{
  background:none;border:none;color:#fff;opacity:.85;font-size:.72rem;letter-spacing:.1em;
  text-transform:uppercase;cursor:pointer;text-decoration:none;padding:0;white-space:nowrap;
}
.cap-links a:hover,.cap-links button:hover{opacity:1;text-decoration:underline}

/* While a category is open the page behind the header is white (light mode) or near-black (dark
   mode), so the see-through dark gradient no longer works - the header gets a solid backdrop
   matching the theme, and in light mode every header element switches to dark ink. */
html.cat-open .cap-header{
  background:rgba(8,8,8,.96);border-bottom:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
html[data-theme="light"] .cap-header{background:rgba(255,255,255,.96);border-bottom-color:rgba(0,0,0,.08)}
html[data-theme="light"] .cap-brand img{filter:none}
html[data-theme="light"] .cap-brand-text b{color:#000}
html[data-theme="light"] .cap-brand-text span{color:rgba(0,0,0,.55)}
html[data-theme="light"] .cap-links a,
html[data-theme="light"] .cap-links button{color:#000}
html[data-theme="light"] #capLampToggle{border-color:rgba(0,0,0,.28) !important}
html[data-theme="light"] .cap-cat-btn{border-color:rgba(0,0,0,.22);color:#000}
html[data-theme="light"] .cap-cat-btn:hover,
html[data-theme="light"] .cap-cat-btn:focus-visible{border-color:#000}
html[data-theme="light"] .cap-cat-btn.active{background:#000;color:#fff;border-color:#000}

.cap-cats{display:flex;gap:6px;flex-wrap:wrap;position:relative}
.cap-cat-btn{
  background:none;border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:999px;
  padding:6px 14px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;
  transition:background .15s,border-color .15s;white-space:nowrap;
}
.cap-cat-btn:hover,.cap-cat-btn:focus-visible{border-color:#fff}
.cap-cat-btn.active{background:#fff;color:#000;border-color:#fff}

@media (max-width:860px){
  .cap-header{padding:calc(10px + var(--safe-top)) 14px 10px}
  .cap-row1{margin-bottom:8px}
  .cap-brand-text{display:none}
  .cap-mobile-hide{display:none !important}
  .cap-cats{overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;-webkit-overflow-scrolling:touch;justify-content:flex-start;scrollbar-width:none}
  .cap-cats::-webkit-scrollbar{display:none}
  .cap-cats.more-right:not(.more-left){-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 44px),transparent)}
  .cap-cats.more-left:not(.more-right){-webkit-mask-image:linear-gradient(90deg,transparent,#000 44px);mask-image:linear-gradient(90deg,transparent,#000 44px)}
  .cap-cats.more-left.more-right{-webkit-mask-image:linear-gradient(90deg,transparent,#000 44px,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,transparent,#000 44px,#000 calc(100% - 44px),transparent)}
}
/* Category rail scroll bar (phones and tablets): a thin track under the categories with a bar that
   shows how much of the row is on screen and moves as you swipe - so it's obvious there are more
   categories off to the right. Only shown when the row is wider than the screen. */
.cap-cats-bar{display:none}
@media (max-width:860px){
  .cap-cats-bar.on{display:block;position:relative;height:3px;margin:9px 0 1px;border-radius:3px;overflow:hidden;
    background:rgba(255,255,255,.2);pointer-events:none}
  .cap-cats-thumb{position:absolute;left:0;top:0;bottom:0;width:40px;border-radius:3px;background:rgba(255,255,255,.92);
    transform:translateX(0);will-change:transform}
  html[data-theme="light"] .cap-cats-bar.on{background:rgba(0,0,0,.12)}
  html[data-theme="light"] .cap-cats-thumb{background:#000}
}

/* ================= discover: continuous flowing carousel ================= */
#discover{position:fixed;inset:0;background:#050505;display:flex;flex-direction:column}
.disc-stage{
  flex:1;position:relative;overflow:hidden;
  padding-top:var(--header-h);padding-bottom:var(--foot-h);
}
.disc-track{
  position:relative;width:100%;height:100%;display:flex;align-items:center;gap:18px;
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;cursor:grab;padding:0 4px;
}
.disc-track::-webkit-scrollbar{display:none}
.disc-track.grabbing{cursor:grabbing}
.disc-card{
  position:relative;flex:0 0 auto;border-radius:6px;overflow:hidden;
  height:min(64vh,640px);
  height:min(64vh,640px,calc(100vh - var(--header-h) - var(--foot-h) - 40px));
  cursor:pointer;background:#111;box-shadow:0 24px 60px rgba(0,0,0,.55);
  transform:scale(.7);
  transform-origin:center center;will-change:transform,opacity;
}
.disc-card img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;transition:opacity .55s ease, filter .6s ease;}
.disc-card img:not(.lrl-loaded){opacity:0;filter:blur(14px)}
.disc-card.is-center{cursor:zoom-in}
/* photos are always in full colour (the Spotlight's own dimming comes from #pageLamp) */
.disc-card img.lrl-loaded{filter:none}

.disc-caption{
  position:absolute;left:0;right:0;bottom:var(--foot-h);z-index:2;padding:18px 24px 16px;
  background:linear-gradient(0deg,rgba(0,0,0,.75) 0%,rgba(0,0,0,0) 100%);
  display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none;
}
.disc-caption b{display:block;font-size:1rem;font-weight:600}
.disc-caption span{display:block;font-size:.78rem;opacity:.75;margin-top:2px}
.disc-hint{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;opacity:.55;text-align:right}

.disc-nav-btn{
  position:absolute;top:50%;transform:translateY(-50%);z-index:200;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.28);color:#fff;
  width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:1.15rem;
  opacity:0;transition:opacity .2s ease,background .2s ease;
}
.disc-stage:hover .disc-nav-btn{opacity:.85}
.disc-nav-btn:hover{background:rgba(0,0,0,.6);opacity:1 !important}
.disc-prev{left:14px}
.disc-next{right:14px}
@media (max-width:860px){ .disc-nav-btn{opacity:.6} .disc-card{height:60vh;height:min(60vh,calc(100vh - var(--header-h) - var(--foot-h) - 32px))} }

.disc-pause{
  position:absolute;right:18px;bottom:calc(var(--foot-h) + 70px);z-index:200;
  background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.3);color:#fff;
  width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:.85rem;
}

#capLampToggle{
  border:1px solid rgba(255,255,255,.3) !important;border-radius:999px;padding:6px 14px !important;
  opacity:.9 !important;text-decoration:none !important;font-size:.7rem !important;
}
#capLampToggle[aria-pressed="true"]{background:rgba(255,196,75,.16);border-color:rgba(255,196,75,.55) !important;color:#ffe9c2 !important}
#capLampToggle{display:inline-flex;align-items:center;gap:7px}
.spot-dot{width:6px;height:6px;border-radius:999px;background:currentColor;opacity:.6;flex:none}
#capLampToggle[aria-pressed="true"] .spot-dot{background:#FFC24B;box-shadow:0 0 6px #FFC24B;opacity:1}
html[data-theme="light"] #capLampToggle[aria-pressed="true"]{color:#7a4d00 !important;background:rgba(255,196,75,.22)}

/* ================= Lamplight: your cursor/finger is a lamp - the photo stays dim
   everywhere except a circle that follows you, matching the original concept board
   exactly (a dim base copy of the photo, with a second bright copy masked to a
   circle that reveals it, plus a soft warm glow). Only active in dark mode, only
   inside the full-screen photo viewer. Never blocks clicks, swipes, or the
   prev/next/close buttons - every layer here is pointer-events:none. */
#lbStage{position:relative;display:inline-block;max-width:92vw;max-height:86vh}
#lbStage img{display:block;max-width:92vw;max-height:86vh;object-fit:contain}
#lbImgDim{
  position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
  filter:grayscale(1) brightness(.2);opacity:0;transition:opacity .5s ease;pointer-events:none;
}
#lbStage.lamp-on #lbImgDim{opacity:1}
#lbStage.lamp-on #lbImg{
  -webkit-mask-image:radial-gradient(circle var(--lr,240px) at var(--lx,50%) var(--ly,50%), #000 0%, rgba(0,0,0,.9) 55%, rgba(0,0,0,0) 100%);
  mask-image:radial-gradient(circle var(--lr,240px) at var(--lx,50%) var(--ly,50%), #000 0%, rgba(0,0,0,.9) 55%, rgba(0,0,0,0) 100%);
}
#lampLayer{
  position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;
  transition:opacity .5s ease;
  background:radial-gradient(circle calc(var(--lr,240px) * 1.2) at var(--lx,50%) var(--ly,50%), rgba(255,184,77,.22), rgba(255,184,77,0) 72%);
}
#lbStage.lamp-on #lampLayer{opacity:1}
@media (max-width:860px){
  #lbStage{ --lr:150px; }
}
@media (prefers-reduced-motion:reduce){
  #lbImgDim,#lampLayer{transition:opacity .2s ease}
  .cat-card img:not(.lrl-loaded),.disc-card img:not(.lrl-loaded){opacity:1;filter:none;transform:none}
}

/* ================= category grid view ================= */
#catview{position:fixed;inset:0;background:var(--paper);color:var(--ink);overflow-y:auto;display:none;
  padding-top:calc(var(--header-h) + 12px);-webkit-overflow-scrolling:touch}
html[data-theme="dark"] #catview{background:#080808;color:#fff}
#catview.on{display:block}
/* #catview already reserves the header height with padding-top, so the heading only needs a
   small gap here (it previously added ANOTHER 110-120px, leaving a big empty band above the title) */
.cat-head{padding:6px 24px 14px;max-width:1400px;margin:0 auto}
@media (max-width:640px){
  .cat-head{padding:4px 14px 10px;}
}
.cat-head h1{font-size:clamp(1.6rem,4vw,2.4rem);margin:0 0 6px;font-weight:600}
.cat-head p{margin:0;opacity:.6;font-size:.9rem;max-width:56ch}
.cat-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative}
.cat-chip{
  border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;
  padding:6px 14px;font-size:.74rem;letter-spacing:.05em;cursor:pointer;text-transform:uppercase;
}
.cat-chip.active{background:var(--ink);color:var(--paper)}
.cat-grid{
  max-width:1400px;margin:0 auto;padding:8px 14px calc(var(--foot-h) + 24px);
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
}
/* Tablet size - 3 columns */
@media (min-width:768px){
  .cat-grid{

.cat-card{position:relative;border-radius:2px;overflow:hidden;cursor:pointer;background:#111;aspect-ratio:4/5}

  /* Touch devices: a lighter blur costs less to composite - matters most here, since the
     Discover carousel eager-loads ~40 photos (20 featured, doubled for the seamless loop)
     right away, and a phone's GPU shouldn't have to blur all of them at full strength at once. */
  .cat-card img:not(.lrl-loaded){filter:blur(7px);transform:scale(1.02)}

/* the footer logo goes to the home page, same as the top logo. Only the logo itself is tappable -
   the rest of the bar is not a link.

   button's width from that file instead of from the trimmed logo box, so the button stretched across
   the whole bar - every tap on the bar went home, and the text next to it was squeezed to nothing.

  -webkit-backdrop-filter:grayscale(1) brightness(.34);backdrop-filter:grayscale(1) brightness(.34);
  -webkit-mask-image:radial-gradient(circle var(--pr,260px) at var(--px,50%) var(--py,50%), transparent 0%, rgba(0,0,0,.25) 45%, #000 100%);

  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  /* A fresh, well-mixed order every visit: random, but weighted so no category bunches up -
     neighbours almost never share a category, even when one category has most of the photos. */
  function spreadMix(list){
    var groups = {}, keys = [], out = [], prev = null;
    shuffle(list).forEach(function(p){ var c = p.category || ""; if (!groups[c]) { groups[c] = []; keys.push(c); } groups[c].push(p); });
    while (out.length < list.length) {
      var cand = keys.filter(function(k){ return groups[k].length && k !== prev; });
      if (!cand.length) cand = keys.filter(function(k){ return groups[k].length; });
      var total = 0; cand.forEach(function(k){ total += groups[k].length * groups[k].length; });
      var r = Math.random() * total, pick = cand[cand.length - 1];
      for (var i = 0; i < cand.length; i++) { r -= groups[cand[i]].length * groups[cand[i]].length; if (r < 0) { pick = cand[i]; break; } }
      out.push(groups[pick].pop()); prev = pick;
    }
    return out;
  }
  /* up to max photos, dealt evenly from every category (random photos each time) */
  function pickBalanced(list, max){
    if (list.length <= max) return list.slice();
    var groups = {}, keys = [], out = [];
    shuffle(list).forEach(function(p){ var c = p.category || ""; if (!groups[c]) { groups[c] = []; keys.push(c); } groups[c].push(p); });
    while (out.length < max) {
      shuffle(keys).forEach(function(k){ if (out.length < max && groups[k].length) out.push(groups[k].pop()); });
    }
    return out;
  }
  /* Thumbnail generated by the site's own image pipeline: /images/uploads/<name> -> /images/thumbs/<name>.webp */
  function thumbFor(src){
    var m = /^\/images\/uploads\/([^\/?#]+)$/.exec(src || "");
    return m ? "/images/thumbs/" + m[1] + ".webp" : src;
  }
  /* the lighter viewer copy (long side 2000px) for the full-screen photo, and the .jpg thumbnail
     for browsers without WebP. Every one falls back to the original if the copy isn't made yet. */
  function uploadName(src){ var m = /^\/images\/uploads\/([^\/?#]+)$/.exec(src || ""); return m ? m[1] : ""; }
  function fullFor(src){ var n = uploadName(src); return n ? "/images/full/" + n + ".webp" : src; }
  function thumbJpgFor(src){ var n = uploadName(src); return n ? "/images/thumbs/" + n + ".jpg" : ""; }
  function imgFallback(img, p){
    var tries = [thumbJpgFor(p.src), p.src].filter(function(u){ return u && u !== img.getAttribute("src"); });
    img.addEventListener("error", function onErr(){
      var next = tries.shift();
      if (next) img.src = next; else { img.removeEventListener("error", onErr); img.style.opacity = "0.3"; }
    });
  }

  /* theme: set in <head> from the home page's saved choice. If the theme is changed on another
     tab, follow it here too. */
  window.addEventListener("storage", function(e){
    if (e.key !== "lrl_theme") return;
    var dark = e.newValue === "dark";
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    var tcm = document.getElementById("themeColorMeta");
    if (tcm) tcm.setAttribute("content", dark ? "#080808" : "#FFFFFF");
  });

  /* both bars are measured live (not guessed in CSS), so the photos, captions and buttons always
     clear them exactly - including the phone's home-indicator safe area inside the footer */
  var lastBars = "";
  function syncHeaderHeight(){
    var h = document.getElementById("capHeader").offsetHeight;
    document.documentElement.style.setProperty("--header-h", h + "px");
    var f = document.getElementById("capFoot");
    var fh = (f && f.offsetHeight) || 0;
    if (fh) document.documentElement.style.setProperty("--foot-h", fh + "px");
    /* bars changed size (fonts arriving, rotation...) -> the photo stage changed too: refit the cards */
    var bars = h + "|" + fh;
    if (lastBars && bars !== lastBars && track) {
      requestAnimationFrame(function(){ $all(".disc-card", track).forEach(sizeCard); if (settleDiscover) settleDiscover(); });
    }
    lastBars = bars;
  }
  syncHeaderHeight();
  if (window.ResizeObserver) {
    var barsRO = new ResizeObserver(function(){ syncHeaderHeight(); });
    barsRO.observe(document.getElementById("capHeader"));
    barsRO.observe(document.getElementById("capFoot"));
  }
  window.addEventListener("resize", syncHeaderHeight);
  window.addEventListener("orientationchange", function(){ setTimeout(syncHeaderHeight, 250); });

  /* each photo's own colour, painted behind its card while it loads (made by the GitHub photo workflow) */
  var PHOTO_COLORS = {};
  var colorsReady = fetch("/images/colors.json", { cache: "no-cache" })
    .then(function(r){ return r.ok ? r.json() : {}; }).catch(function(){ return {}; })
    .then(function(c){ PHOTO_COLORS = (c && typeof c === "object") ? c : {}; paintCards(); });
  function paintCards(){
    $all(".disc-card[data-name], .cat-card[data-name]").forEach(function(card){
      var c = PHOTO_COLORS[card.getAttribute("data-name")];
      if (c && !card.style.backgroundColor) card.style.backgroundColor = c;
    });
  }
  function tint(card, src){
    var n = uploadName(src);
    if (!n) return;
    card.setAttribute("data-name", n);
    if (PHOTO_COLORS[n]) card.style.backgroundColor = PHOTO_COLORS[n];
  }

  fetch("/content.json", { cache: "no-cache" }).then(function(r){ return r.json(); }).then(function(d){
    DATA = d;
    PHOTOS = (d.photos || []).filter(function(p){ return p && p.src; });
    NICHES = d.niches || [];
    boot();
  }).catch(function(err){
    $("#discTitle").textContent = "Could not load photos";
    console.error(err);
  });

  function boot(){
    buildHeader();
    buildDiscover();
    initLamp();
    syncHeaderHeight();
    applyParams();
  }

  /* ---------------- Lamplight: warm glow that follows cursor/finger, dark mode + full photo view only ---------------- */
  function initLamp(){
    var stage = $("#lbStage");
    var lb = $("#capLb");
    var toggle = $("#capLampToggle");
    (function placeSpotlight(){
      var home = toggle && toggle.parentNode;
      var discSlot = document.getElementById("discSpotSlot"), catSlot = document.getElementById("catSpotSlot");
      if (!toggle || !home || !discSlot || !catSlot || !window.matchMedia) return;
      var mq = window.matchMedia("(max-width:860px)");
      function place(){
        var target = !mq.matches ? home
          : (document.documentElement.classList.contains("cat-open") ? catSlot : discSlot);
        if (toggle.parentNode !== target) { target.appendChild(toggle); syncHeaderHeight(); }
      }
      place();
      if (mq.addEventListener) mq.addEventListener("change", place); else if (mq.addListener) mq.addListener(place);
      /* follow Discover <-> category switches (they toggle .cat-open on <html>) */
      if (window.MutationObserver) new MutationObserver(place).observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
    })();
    if (!stage || !lb || !toggle) return;

    var active = false, lastMoveAt = 0;
    /* positions are tracked in PIXELS relative to the photo itself (lbStage), not
       percentages of the whole dark modal - the mask/glow need to align exactly
       with the visible image, which is smaller than the full-screen backdrop. */
    var curX = 0, curY = 0, targetX = 0, targetY = 0, haveStageSize = false;
    var idlePhase = Math.random() * 1000;

    var spot = false;                       /* Spotlight: off on every visit, only the button turns it on */
    function spotOn(){ return spot; }
    function lbOpen(){ return lb.classList.contains("on"); }

    function updateLampVisibility(){
      /* the spotlight only ever shows over a full, still photo - not the moving strip,
         not the grid. Turning the lamp on also parks the carousel (see startAutoScroll). */
      var show = spotOn() && lbOpen();
      stage.classList.toggle("lamp-on", show);
      if (show && !active) centerTarget();
      if (show) lbWake();
      plWake();
    }

    function centerTarget(){
      var r = stage.getBoundingClientRect();
      targetX = r.width / 2; targetY = r.height / 2;
      curX = targetX; curY = targetY;
      haveStageSize = r.width > 0;
    }

    function setTarget(clientX, clientY){
      var r = stage.getBoundingClientRect();
      targetX = Math.max(0, Math.min(r.width, clientX - r.left));
      targetY = Math.max(0, Math.min(r.height, clientY - r.top));
      haveStageSize = r.width > 0;
      lastMoveAt = performance.now();
      active = true;
    }

    /* ---- phone tilt (gyro): a 0..1 aim point, used whenever no finger/mouse moved recently ---- */
    var tilt = { x: .5, y: .5, at: 0, bx: null, by: null, ang: null, asked: false };
    function onTilt(e){
      if (e.gamma == null || e.beta == null) return;
      /* turn the raw sensor angles into screen left/right + up/down, whichever way the phone is turned */
      var ang = (screen.orientation && typeof screen.orientation.angle === "number") ? screen.orientation.angle
              : (typeof window.orientation === "number" ? window.orientation : 0);
      var ax = e.gamma, ay = e.beta;
      if (ang === 90) { ax = e.beta; ay = -e.gamma; }
      else if (ang === -90 || ang === 270) { ax = -e.beta; ay = e.gamma; }
      else if (ang === 180) { ax = -e.gamma; ay = -e.beta; }
      /* however the phone is being held when the light comes on counts as "centre", and that
         centre slowly follows you, so a relaxed grip never leaves the light stuck at an edge */
      if (tilt.bx === null || tilt.ang !== ang) { tilt.bx = ax; tilt.by = ay; tilt.ang = ang; }
      else { tilt.bx += (ax - tilt.bx) * 0.0015; tilt.by += (ay - tilt.by) * 0.0015; }
      tilt.x = Math.max(0, Math.min(1, .5 + (ax - tilt.bx) / 32));
      tilt.y = Math.max(0, Math.min(1, .5 + (ay - tilt.by) / 26));
      tilt.at = performance.now();
    }
    function startTilt(){
      if (tilt.asked || !window.DeviceOrientationEvent) return;
      tilt.asked = true;
      try {
        if (typeof DeviceOrientationEvent.requestPermission === "function") {
          DeviceOrientationEvent.requestPermission().then(function(r){
            if (r === "granted") window.addEventListener("deviceorientation", onTilt, {passive:true});
          }).catch(function(){});
        } else window.addEventListener("deviceorientation", onTilt, {passive:true});
      } catch(e){}
    }
    function tiltRecent(now){ return now - tilt.at < 600; }

    var pl = { cx: innerWidth/2, cy: innerHeight/2, tx: innerWidth/2, ty: innerHeight/2, at: 0 };
    function plAim(x, y){ pl.tx = x; pl.ty = y; pl.at = performance.now(); }
    window.addEventListener("mousemove", function(e){ plAim(e.clientX, e.clientY); }, {passive:true});
    ["touchstart","touchmove"].forEach(function(ev){
      window.addEventListener(ev, function(e){ if (e.touches && e.touches[0]) plAim(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
    });
    var plWasOn = false, plRunning = false;
    function plLoop(){
      var on = spotOn() && !lbOpen();
      if (on !== plWasOn) { document.documentElement.classList.toggle("page-lamp-on", on); plWasOn = on; }
      if (!on) { plRunning = false; return; }   /* sleeps while off - no work, no battery drain */
      requestAnimationFrame(plLoop);
      var now = performance.now();
      if (now - pl.at > 1200 && tiltRecent(now)) { pl.tx = tilt.x * innerWidth; pl.ty = tilt.y * innerHeight; }
      var k = reduceMotion ? 1 : 0.14;
      pl.cx += (pl.tx - pl.cx) * k; pl.cy += (pl.ty - pl.cy) * k;
      var rs = document.documentElement.style;
      rs.setProperty("--px", pl.cx.toFixed(1) + "px");
      rs.setProperty("--py", pl.cy.toFixed(1) + "px");
    }
    function plWake(){ if (!plRunning) { plRunning = true; requestAnimationFrame(plLoop); } }

    /* tracked on the whole modal (lb), not just the small photo, so moving anywhere over
       the dark surrounding area still aims the lamp - it just clamps to the photo's edges */
    lb.addEventListener("mousemove", function(e){ setTarget(e.clientX, e.clientY); }, {passive:true});
    lb.addEventListener("mouseleave", function(){ active = false; });
    lb.addEventListener("touchstart", function(e){
      if (e.touches && e.touches[0]) setTarget(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive:true});
    lb.addEventListener("touchmove", function(e){
      if (e.touches && e.touches[0]) setTarget(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive:true});
    lb.addEventListener("touchend", function(){
      /* leave the glow where the finger was for a moment, then let it drift back to idle -
         there's no hover on mobile, so a hard cut back to centre would look abrupt */
      setTimeout(function(){ active = false; }, 1200);
    }, {passive:true});

    var lbRunning = false;
    function loop(t){
      if (!stage.classList.contains("lamp-on")) { lbRunning = false; return; }
      requestAnimationFrame(loop);
      if (!haveStageSize) centerTarget();
      var now = performance.now();
      var recentlyActive = active || (now - lastMoveAt < 900);
      var r = stage.getBoundingClientRect();
      if (!recentlyActive && tiltRecent(now)) { targetX = tilt.x * r.width; targetY = tilt.y * r.height; }
      else if (!recentlyActive) {
        if (reduceMotion) { targetX = r.width/2; targetY = r.height/2; }
        else {
          /* idle: gentle organic drift, so the effect still reads on mobile / mouse-less visits
             instead of sitting dead-centre and static the whole time */
          targetX = r.width/2 + Math.sin((t + idlePhase) / 3800) * (r.width * 0.18);
          targetY = r.height/2 + Math.cos((t + idlePhase) / 4600) * (r.height * 0.16);
        }

      var ease = reduceMotion ? 1 : 0.08;
      curX += (targetX - curX) * ease;
      curY += (targetY - curY) * ease;
      stage.style.setProperty("--lx", curX.toFixed(1) + "px");
      stage.style.setProperty("--ly", curY.toFixed(1) + "px");
    }
    function lbWake(){ if (!lbRunning) { lbRunning = true; requestAnimationFrame(loop); } }

    function paintToggle(){
      toggle.setAttribute("aria-pressed", String(spot));
      toggle.setAttribute("aria-label", spot ? "Turn the spotlight off" : "Turn the spotlight on");
      toggle.innerHTML = '<span class="spot-dot" aria-hidden="true"></span>Spotlight';
    }
    toggle.addEventListener("click", function(){
      spot = !spot;
      if (spot) startTilt();
      paintToggle();
      updateLampVisibility();
      if (window.__spotChanged) window.__spotChanged(spot);
    });
    paintToggle();
    updateLampVisibility();

    if (window.MutationObserver) {
      var mo = new MutationObserver(updateLampVisibility);
      mo.observe(lb, { attributes: true, attributeFilter: ["class"] });
    }
    window.__lampRecheck = updateLampVisibility;
    window.__spotOn = spotOn;
  }

  function buildHeader(){
    var catsHost = $("#capCats");
    catsHost.innerHTML = "";
    /* "All" = the Discover stream of every category; it's also the way back from a category */
    var allBtn = document.createElement("button");
    allBtn.className = "cap-cat-btn active"; allBtn.type = "button";
    allBtn.textContent = "All";
    allBtn.setAttribute("data-cat", "");
    allBtn.addEventListener("click", function(){ if (currentCat) goDiscover(); });
    catsHost.appendChild(allBtn);
    NICHES.forEach(function(n){
      var name = (n && n.name) || n;
      var btn = document.createElement("button");
      btn.className = "cap-cat-btn"; btn.type = "button";
      btn.textContent = name;
      btn.setAttribute("data-cat", name);
      btn.addEventListener("click", function(){ showCategory(name); });
      catsHost.appendChild(btn);
    });
    catsHost.addEventListener("scroll", railEdges, {passive:true});
    $("#catChips").addEventListener("scroll", railEdges, {passive:true});
    window.addEventListener("resize", railEdges);
    railEdges();
    /* the chips change width once the site's fonts arrive - measure again then */
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(railEdges).catch(function(){});
    railNudge();

    /* same logo file as the home page (the one set in the Content Editor), trimmed to its artwork */
    if (DATA.logo) {
      $all(".lg-crop > img").forEach(function(img){
        img.addEventListener("error", function onErr(){ img.removeEventListener("error", onErr); img.src = "/logo.png"; });
        img.src = DATA.logo;
      });
    }
    if (window.LRL && LRL.trimLogos) LRL.trimLogos();

    /* the enquiry window uses the live categories, email and form settings */
    if (window.LRL && LRL.enquiry) {
      var evs = [];
      PHOTOS.forEach(function(p){ (p.eventTypes||[]).forEach(function(et){ if (evs.indexOf(et) === -1) evs.push(et); }); });
      LRL.enquiry.configure({
        categories: NICHES.map(function(n){ return (n && n.name) || n; }),
        formspreeId: DATA.formspreeId, email: DATA.email, eventTypes: evs
      });
    }

    $("#capTagline").textContent = DATA.tagline || "";
    $("#capFootTagline").textContent = "Every frame begins with a conversation";
    $("#capCollective").addEventListener("click", function(){ window.location.href = "/#collective"; });

    var socials = DATA.socials || [];
    var ig = socials.find(function(s){ return /instagram/i.test(s.name||""); }) || socials[0];
    if (ig && ig.url) $("#capElsewhere").href = ig.url;
    else $("#capElsewhere").style.display = "none";

    syncHeaderHeight();
  }

  /* category rail: fade the edge(s) that still have more chips to scroll to, and move the bar under
     it (phones and tablets) - the bar's length is the share of the row on screen, its position is
     how far you've swiped */
  function syncRail(r, bar, thumb){
    if (!r) return;
    var over = r.scrollWidth - r.clientWidth;
    r.classList.toggle("more-left", r.scrollLeft > 4);
    r.classList.toggle("more-right", r.scrollLeft + r.clientWidth < r.scrollWidth - 4);
    if (!bar || !thumb) return;
    var show = over > 4;
    if (bar.classList.contains("on") !== show) { bar.classList.toggle("on", show); syncHeaderHeight(); }
    if (!show) return;
    var bw = bar.clientWidth;
    if (!bw) return;
    var tw = Math.max(32, Math.round(bw * r.clientWidth / r.scrollWidth));
    var x = Math.round((bw - tw) * Math.min(1, Math.max(0, r.scrollLeft / over)));
    thumb.style.width = tw + "px";
    thumb.style.transform = "translateX(" + x + "px)";
  }
  function railEdges(){
    syncRail($("#capCats"), $("#capCatsBar"), $("#capCatsThumb"));
    if (currentCat) syncRail($("#catChips"), $("#catChipsBar"), $("#catChipsThumb"));   /* the event filters in a category */
  }
  /* first visit in a session: the category row slides a little to the left and back once, so it's
     clear it can be swiped. Skipped if you're already touching it, if a category link already moved
     it, or if you've asked your phone for less motion. */
  function railNudge(){
    var r = $("#capCats");
    if (!r || reduceMotion) return;
    try { if (sessionStorage.getItem("lrl_rail_hint") === "1") return; } catch(e){}
    var touched = false;
    function mark(){ touched = true; }
    r.addEventListener("touchstart", mark, {passive:true});
    r.addEventListener("wheel", mark, {passive:true});
    setTimeout(function(){
      var room = r.scrollWidth - r.clientWidth;
      if (touched || r.scrollLeft > 4 || room < 24) return;
      try { sessionStorage.setItem("lrl_rail_hint", "1"); } catch(e){}
      r.scrollTo({ left: Math.min(84, room), behavior: "smooth" });
      setTimeout(function(){ if (!touched) r.scrollTo({ left: 0, behavior: "smooth" }); }, 750);
    }, 1500);
  }
  /* mark the chip for what's on screen and slide the rail so it's visible (it was off-screen on phones) */
  function markActiveChip(name){
    var rail = $("#capCats"), active = null;
    $all(".cap-cat-btn", rail).forEach(function(b){
      var on = b.getAttribute("data-cat") === (name || "");
      b.classList.toggle("active", on);
      if (on) { active = b; b.setAttribute("aria-current", "true"); } else b.removeAttribute("aria-current");
    });
    if (active && rail.scrollWidth > rail.clientWidth) {
      var target = active.offsetLeft - (rail.clientWidth - active.offsetWidth) / 2;
      rail.scrollTo({ left: Math.max(0, target), behavior: reduceMotion ? "auto" : "smooth" });
    }
    setTimeout(railEdges, 400);
  }

  /* ---------------- discover: continuous flowing carousel with dock magnification ---------------- */
  function buildDiscover(){
    track = $("#discTrack");
    var pool = PHOTOS.filter(function(p){ return p.showInAll !== false; });
    if (!pool.length) pool = PHOTOS;
    /* Discover is a taster, not the whole archive: every photo here downloads straight away
       (twice, for the seamless loop), so at hundreds of photos showing all of them would cost a
       phone tens of MB. Instead: up to 30 random photos, dealt evenly from every category and
       mixed so neighbours differ - a different selection and order on every visit. */
    var MAX_DISCOVER = 30;
    discoverOrder = spreadMix(pickBalanced(pool, MAX_DISCOVER));

    /* build once, then an identical clone appended after it, so the loop point is invisible
       (the exact technique the homepage strips use). Cards start at a sensible placeholder
       width and are corrected to the photo's REAL pixel aspect ratio once its thumbnail loads -
       the CMS's "ratio" field turned out not to reliably match the actual image, which is what
       was causing photos to be cropped. */
    var loadedCount = 0, totalCount = discoverOrder.length * 2, didInitialCentre = false;
    function settle(){
      var firstCopy = $all('.disc-card[data-copy="0"]', track);
      trackLoopW = firstCopy.length ? (firstCopy[firstCopy.length-1].offsetLeft + firstCopy[firstCopy.length-1].offsetWidth) - firstCopy[0].offsetLeft + 18 : 0;
      if (!trackPos) trackPos = track.scrollLeft = Math.round(trackLoopW/2);
      if (!didInitialCentre && firstCopy.length) {
        /* the very first settle only gets us near the middle of the loop - snap once to
           whichever card actually landed closest, so a specific photo is genuinely
           front-and-centre on arrival rather than an arbitrary offset between two */
        var mid = trackPos + track.clientWidth/2;
        var nearest = nearestCardTo(mid);
        if (nearest) {
          trackPos = Math.round((nearest.offsetLeft + nearest.offsetWidth/2) - track.clientWidth/2);
          track.scrollLeft = trackPos;
          didInitialCentre = true;
        }
      }
      applyDockScale();
    }
    settleDiscover = settle;
    var placeholderW = Math.round(Math.min(512, (track.clientWidth || window.innerWidth) * maxCardShare()));
    [discoverOrder, discoverOrder].forEach(function(list, copyNum){
      list.forEach(function(p){
        var card = document.createElement("div");
        card.className = "disc-card";
        card.dataset.copy = copyNum;
        card.style.width = placeholderW + "px"; /* placeholder until the real dimensions are known */
        tint(card, p.src);
        var img = document.createElement("img");
        img.loading = "eager";
        img.alt = p.alt || p.title || "";
        img.addEventListener("load", function(){
          if (img.naturalWidth && img.naturalHeight) {
            card.dataset.ratio = String(img.naturalWidth / img.naturalHeight);
            sizeCard(card);
          }
          loadedCount++;
          if (loadedCount === totalCount || loadedCount === 6) settle();
        });
        img.addEventListener("error", function(){
          if (img.src !== p.src) { img.src = p.src; return; } /* thumbnail missing: fall back to the full photo */
          loadedCount++;
        });
        img.src = thumbFor(p.src);
        card.appendChild(img);
        card.addEventListener("click", function(){ onCardClick(card, p); });
        track.appendChild(card);
      });
    });

    /* start the loop even before every thumbnail has loaded, using the best measurement so far */
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      settle();
      if (!reduceMotion) startAutoScroll();
    }); });
    /* re-settle once more shortly after, once most thumbnails (small WebP files) have arrived */
    setTimeout(settle, 900);

    $("#discPause").addEventListener("click", toggleDiscoverPause);
    $("#discPrev").addEventListener("click", function(){ nudge(-1); });
    $("#discNext").addEventListener("click", function(){ nudge(1); });

    track.addEventListener("touchstart", function(){ isTouching = true; }, {passive:true});
    track.addEventListener("touchend", function(){ isTouching = false; extAt = performance.now(); }, {passive:true});
    track.addEventListener("mousedown", function(){ track.classList.add("grabbing"); });
    window.addEventListener("mouseup", function(){ track.classList.remove("grabbing"); });
    track.addEventListener("scroll", function(){
      applyDockScale();
      updateCaptionFromCenter();
      if (Math.abs(track.scrollLeft - trackPos) > 1.5) { extAt = performance.now(); }
    }, {passive:true});
  }

  /* a photo card is as tall as the stage allows, at the photo's real shape - but never wider than
     most of the screen, so on a phone the next photos still peek in from the sides */
  var settleDiscover = null;
  function maxCardShare(){ return window.innerWidth <= 640 ? 0.84 : 0.9; }
  function sizeCard(card){
    var r = parseFloat(card.dataset.ratio);
    if (!r || !track) return;
    card.style.height = "";                       /* back to the stylesheet height, then fit */
    var h = card.offsetHeight;
    var maxW = (track.clientWidth || window.innerWidth) * maxCardShare();
    var w = h * r;
    if (w > maxW) { w = maxW; card.style.height = Math.round(maxW / r) + "px"; }
    card.style.width = Math.round(w) + "px";
  }
  /* turning the phone or resizing the window: refit every card and re-measure the loop */
  (function(){
    var t = null, lastW = window.innerWidth, lastH = window.innerHeight;
    window.addEventListener("resize", function(){
      if (window.innerWidth === lastW && Math.abs(window.innerHeight - lastH) < 120) return; /* phone address bar */
      lastW = window.innerWidth; lastH = window.innerHeight;
      clearTimeout(t);
      t = setTimeout(function(){
        if (!track) return;
        $all(".disc-card", track).forEach(sizeCard);
        if (settleDiscover) settleDiscover();
      }, 180);
    });
  })();

  function nearestCardTo(x){
    var cards = $all(".disc-card", track);
    var best = null, bestD = Infinity;
    cards.forEach(function(c){
      var cx = c.offsetLeft + c.offsetWidth/2;
      var d = Math.abs(cx - x);
      if (d < bestD) { bestD = d; best = c; }
    });
    return best;
  }

  function onCardClick(card, photo){
    var center = track.scrollLeft + track.clientWidth/2;
    var cardCenter = card.offsetLeft + card.offsetWidth/2;
    if (Math.abs(cardCenter - center) < track.clientWidth * 0.22) {
      lbList = discoverOrder; lbIdx = discoverOrder.indexOf(photo);
      renderLb(); showOverlay("lb"); focusLb();
    } else {
      manualPauseUntil = performance.now() + 4000;
      track.scrollTo({ left: cardCenter - track.clientWidth/2, behavior: "smooth" });
    }
  }

  function nudge(dir){
    manualPauseUntil = performance.now() + 4000;
    var center = track.scrollLeft + track.clientWidth/2;
    var cards = $all(".disc-card", track).sort(function(a,b){ return (a.offsetLeft) - (b.offsetLeft); });
    var currentIdx = 0, bestD = Infinity;
    cards.forEach(function(c, i){
      var d = Math.abs((c.offsetLeft + c.offsetWidth/2) - center);
      if (d < bestD) { bestD = d; currentIdx = i; }
    });
    var targetIdx = currentIdx + dir;
    if (targetIdx < 0) targetIdx = 0;
    if (targetIdx >= cards.length) targetIdx = cards.length - 1;
    var target = cards[targetIdx];
    track.scrollTo({ left: (target.offsetLeft + target.offsetWidth/2) - track.clientWidth/2, behavior: "smooth" });
  }

  /* dock magnification: cheap (no forced layout reads) - uses cached offsetLeft/offsetWidth
     against the live scrollLeft, same "read once, animate via transform" idea as the rest of the site */
  function applyDockScale(){
    if (!track) return;
    var centerX = track.scrollLeft + track.clientWidth/2;
    var half = track.clientWidth/2;
    var cards = $all(".disc-card", track);
    var winner = null, winnerDist = Infinity;
    var shrink = window.innerWidth <= 640 ? 0.22 : 0.32;  /* gentler on phones, so the peeking photos stay readable */
    cards.forEach(function(card){
      var cx = card.offsetLeft + card.offsetWidth/2;
      var dist = Math.abs(cx - centerX);
      var t = Math.min(1, dist / half);
      var scale = 1 - t*shrink;
      card.style.transform = "scale(" + scale.toFixed(3) + ")";
      if (dist < winnerDist) { winnerDist = dist; winner = card; }
    });
    /* exactly one card is ever "the center" one - the single nearest, not everything within
       some pixel band (which could match several adjacent cards on a wide desktop screen) */
    cards.forEach(function(card){ card.classList.toggle("is-center", card === winner); });
  }

  function updateCaptionFromCenter(){
    var centerX = track.scrollLeft + track.clientWidth/2;
    var best = nearestCardTo(centerX);
    if (!best) return;
    var cards = $all(".disc-card", track);
    var idx = cards.indexOf(best) % discoverOrder.length;
    var p = discoverOrder[idx];
    if (p) {
      $("#discTitle").textContent = p.title || "Untitled";
      $("#discMeta").textContent = [p.category, (p.eventTypes||[]).join(", ")].filter(Boolean).join(" · ");
    }
  }

  /* continuous, whole-pixel-per-frame motion - identical technique to the homepage's
     already-tested auto-scroll engine, so it inherits the same smoothness on every screen */
  var lastFrameT = 0, capFrameLog = [], captionThrottle = 0;
  function refreshScrollPlan(){
    var perFrame = scrollSpeed() * frameEst / 1000;
    var plan = perFrame >= 1.5
      ? { px: Math.round(perFrame), every: 1, perFrame: perFrame }
      : { px: 1, every: Math.max(1, Math.round(1/perFrame)), perFrame: perFrame };
    if (!scrollPlan || Math.abs(plan.perFrame - scrollPlan.perFrame)/scrollPlan.perFrame > 0.12) scrollPlan = plan;
  }
  function startAutoScroll(){
    var frameTick = 0;
    function loop(now){
      autoRaf = requestAnimationFrame(loop);
      if (lastFrameT) {
        var dt = now - lastFrameT;
        if (dt > 2 && dt < 60) {
          capFrameLog.push(dt);
          if (capFrameLog.length > 30) capFrameLog.shift();
          if (capFrameLog.length >= 8) {
            var s = capFrameLog.slice().sort(function(a,b){return a-b;});
            frameEst = s[s.length>>1];
          }
        }
      }
      lastFrameT = now;
      refreshScrollPlan();
      frameTick++;
      if (discoverPaused || isTouching || currentCat || openOverlay || enqOpen()) return;
      if (window.__spotOn && window.__spotOn()) return; /* lamp on -> the strip holds still, matching a calm, static room */
      if (manualPauseUntil && now < manualPauseUntil) return;
      if (extAt && now - extAt < 250) return;
      if (frameTick % scrollPlan.every !== 0) return;

      var actual = track.scrollLeft;
      if (Math.abs(actual - trackPos) > 1.5) { trackPos = Math.round(actual); extAt = now; return; }
      trackPos += scrollPlan.px;
      if (trackLoopW > 0 && trackPos >= trackLoopW * 1.5) trackPos -= trackLoopW;
      track.scrollLeft = trackPos;
      applyDockScale();

      captionThrottle++;
      if (captionThrottle > 12) { captionThrottle = 0; updateCaptionFromCenter(); }
      /* note: the scroll listener above also updates the caption immediately for manual nav (arrows/clicks) */
    }
    autoRaf = requestAnimationFrame(loop);
  }

  function pauseThenResume(){
    extAt = performance.now();
  }

  function toggleDiscoverPause(){
    discoverPaused = !discoverPaused;
    $("#discPause").textContent = discoverPaused ? "▶" : "❚❚";
    $("#discPause").setAttribute("aria-label", discoverPaused ? "Resume slideshow" : "Pause slideshow");
  }

  /* ---------------- navigation + history ----------------
     Every screen change goes through these few functions so the phone/browser Back button
     always does the expected thing:
       photo viewer or enquiry form open  -> Back closes it (you stay where you were)
       a category is open                 -> Back returns to Discover
       on Discover                        -> Back leaves the page
     Only leaving Discover adds a history step - switching between categories or event chips
     just updates the current step, so Back never has to walk through every chip you tapped. */
  function histState(){
    var st = window.history.state;
    return (st && st.lrl) ? st : null;
  }
  function updateUrl(cat, ev, push, fromDiscover){
    var url = new URL(window.location.href);
    if (cat) { url.searchParams.set("category", cat); } else { url.searchParams.delete("category"); }
    if (ev) { url.searchParams.set("event", ev); } else { url.searchParams.delete("event"); }
    var st = { lrl: 1, cat: cat || null, ev: ev || null, fromDiscover: !!fromDiscover, overlay: null };
    if (push) { window.history.pushState(st, "", url); }
    else { window.history.replaceState(st, "", url); }
  }

  /* normalise the entry we arrived on (also clears a stale "viewer open" flag left by a page reload) */
  (function(){
    var params = new URLSearchParams(window.location.search);
    var st = histState();
    var cat = params.get("category");
    updateUrl(cat, params.get("event"), false, !!(cat && st && st.fromDiscover));
  })();

  /* ---------------- category grid ---------------- */
  /* mode: undefined = normal click (adds a history step only when leaving Discover),
           "replace" = update the current step, "none" = don't touch history (Back/Forward itself) */
  function showCategory(name, eventFilter, mode){
    var wasOnDiscover = !currentCat;
    currentCat = name; currentEvent = eventFilter || null;
    document.documentElement.classList.add("cat-open");
    if (window.__lampRecheck) window.__lampRecheck();
    $("#discover").style.display = "none";
    $("#catview").classList.add("on");
    $("#catBack").style.display = "block";
    markActiveChip(name);

    var nicheInfo = NICHES.find(function(n){ return (n.name||n) === name; }) || {};
    $("#catTitle").textContent = name;
    $("#catLine").textContent = nicheInfo.line || "";

    var catPhotos = PHOTOS.filter(function(p){ return p.category === name; });

    var chipsHost = $("#catChips");
    chipsHost.innerHTML = "";
    var eventTypes = [];
    catPhotos.forEach(function(p){ (p.eventTypes||[]).forEach(function(et){ if (eventTypes.indexOf(et) === -1) eventTypes.push(et); }); });
    /* an event name from a link that doesn't exist (any more) shows the whole category instead of nothing */
    if (currentEvent && eventTypes.indexOf(currentEvent) === -1) {
      currentEvent = eventTypes.filter(function(et){ return et.toLowerCase() === String(currentEvent).toLowerCase(); })[0] || null;
    }
    if (eventTypes.length) {
      var allChip = document.createElement("button");
      allChip.type = "button";
      allChip.className = "cat-chip mono" + (!currentEvent ? " active" : "");
      allChip.textContent = "All " + name;
      allChip.addEventListener("click", function(){ showCategory(name, null); });
      chipsHost.appendChild(allChip);
      eventTypes.forEach(function(et){
        var chip = document.createElement("button");
        chip.type = "button";
        chip.className = "cat-chip mono" + (currentEvent === et ? " active" : "");
        chip.textContent = et;
        chip.addEventListener("click", function(){ showCategory(name, et); });
        chipsHost.appendChild(chip);
      });
    }

    var visible = currentEvent ? catPhotos.filter(function(p){ return (p.eventTypes||[]).indexOf(currentEvent) > -1; }) : catPhotos;
    renderGrid(visible);
    /* keep the chosen event chip in view (it could sit off-screen on a phone), then size the bar */
    var activeChip = chipsHost.querySelector(".cat-chip.active");
    if (activeChip && chipsHost.scrollWidth > chipsHost.clientWidth) {
      chipsHost.scrollLeft = Math.max(0, activeChip.offsetLeft - (chipsHost.clientWidth - activeChip.offsetWidth) / 2);
    } else chipsHost.scrollLeft = 0;
    railEdges();

    if (mode !== "none") {
      var push = (mode !== "replace") && wasOnDiscover;
      var prev = histState();
      updateUrl(name, currentEvent, push, push || !!(prev && prev.fromDiscover));
    }
    $("#catview").scrollTop = 0;
    syncHeaderHeight();
  }

  function renderGrid(list){
    lbList = list;
    var grid = $("#catGrid");
    grid.innerHTML = "";
    if (!list.length) {
      grid.innerHTML = '<div class="cat-empty mono">New work coming soon.<br><button type="button" class="cat-empty-enq">Enquire about ' + esc(currentCat || "a shoot") + ' ↗</button></div>';
      var enq = grid.querySelector(".cat-empty-enq");
      if (enq) enq.addEventListener("click", openEnquiry);
      return;
    }
    /* phones: the first photo runs full width at its own shape (a lead frame), then two columns;
       if that leaves one photo on its own at the end, it runs full width too instead of a half-empty row */
    var lastWide = (list.length - 1) % 2 === 1;
    list.forEach(function(p, i){
      var card = document.createElement("div");
      var wide = (i === 0 || (lastWide && i === list.length - 1));
      card.className = "cat-card" + (wide ? " wide" : "");
      /* a full-width photo on a phone gets the sharper viewer copy; everything else the small thumbnail */
      var gridSrc = (wide && window.innerWidth < 768) ? fullFor(p.src) : thumbFor(p.src);
      tint(card, p.src);
      card.setAttribute("role", "button");
      card.setAttribute("tabindex", "0");
      card.setAttribute("aria-label", "Open photo: " + (p.title || "Untitled"));
      var ratio = /^\s*(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)\s*$/.exec(p.ratio || "");
      if (ratio) card.style.setProperty("--r", ratio[1] + " / " + ratio[2]);
      card.innerHTML = '<img loading="lazy" decoding="async" src="'+esc(gridSrc)+'" alt="'+esc(p.alt||p.title||"")+'" style="object-position:'+esc((p.imagePosition||"center").toLowerCase())+'">'+
        '<div class="cc-cap"><span class="cc-t">'+esc(p.title||"")+'</span>'+(p.client?'<span class="cc-c"> — '+esc(p.client)+'</span>':'')+'</div>';
      var img = card.querySelector("img");
      imgFallback(img, p);
      img.addEventListener("load", function(){
        /* the Content Editor's ratio isn't always right - the photo's real shape wins */
        if (img.naturalWidth && img.naturalHeight) card.style.setProperty("--r", img.naturalWidth + " / " + img.naturalHeight);
      });
      function openIt(){ lbList = list; lbIdx = i; renderLb(); showOverlay("lb"); focusLb(); }
      card.addEventListener("click", openIt);
      card.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openIt(); } });
      grid.appendChild(card);
    });
  }

  function backToDiscover(mode){
    currentCat = null; currentEvent = null;
    document.documentElement.classList.remove("cat-open");
    $("#catview").classList.remove("on");
    $("#catBack").style.display = "none";
    $("#discover").style.display = "";   /* back to the stylesheet's flex layout (was forced to "block") */
    markActiveChip(null);
    if (mode !== "none") updateUrl(null, null, false, false);
    syncHeaderHeight();
    applyDockScale();
    if (window.__lampRecheck) window.__lampRecheck();
  }

  /* "← Discover" / Escape: if we got here from Discover, step Back (so the history stays tidy);
     if you arrived straight on a category link, just switch to Discover in place */
  function goDiscover(){
    var st = histState();
    if (st && st.fromDiscover && st.cat) window.history.back();
    else backToDiscover("replace");
  }
  $("#catBack").addEventListener("click", goDiscover);
  $("#catBackInline").addEventListener("click", goDiscover);

  /* ---------------- overlays (photo viewer + enquiry form) ---------------- */
  function overlayEl(name){ return $("#capLb"); }
  function showOverlay(name){
    if (openOverlay && openOverlay !== name) hideOverlayUI(openOverlay);
    var el = overlayEl(name);
    var wasOpen = el.classList.contains("on");
    el.classList.add("on");
    openOverlay = name;
    if (!wasOpen) {
      var st = histState() || { cat: currentCat, ev: currentEvent, fromDiscover: false };
      window.history.pushState({ lrl: 1, cat: st.cat || null, ev: st.ev || null, fromDiscover: !!st.fromDiscover, overlay: name }, "", window.location.href);
    }
  }
  function hideOverlayUI(name){
    overlayEl(name).classList.remove("on");
    if (openOverlay === name) openOverlay = null;
  }
  function closeOverlay(name){
    var st = histState();
    if (st && st.overlay === name && openOverlay === name) window.history.back(); /* popstate below hides it */
    else hideOverlayUI(name);
  }

  window.addEventListener("popstate", function(){
    var st = histState();
    /* Back while the viewer / enquiry is open: just close it - the page underneath is unchanged */
    if (openOverlay && !(st && st.overlay === openOverlay)) {
      hideOverlayUI(openOverlay);
      return;
    }
    /* Forward onto an old "overlay open" step: nothing to show there, step straight back off it */
    if (st && st.overlay && !openOverlay) { window.history.back(); return; }

    var params = new URLSearchParams(window.location.search);
    var cat = resolveCat(params.get("category"));
    var ev = params.get("event") || null;
    if (cat) {
      if (cat !== currentCat || ev !== currentEvent) showCategory(cat, ev, "none");
    } else if (currentCat) {
      backToDiscover("none");
    }
  });

  /* keyboard vs. mouse/touch: only keyboard users need focus moved onto a button (and its ring) */
  var kbdNav = false;
  document.addEventListener("keydown", function(e){ if (e.key === "Tab" || e.key === "Enter" || e.key === " ") kbdNav = true; }, true);
  ["mousedown", "touchstart"].forEach(function(ev){ document.addEventListener(ev, function(){ kbdNav = false; }, { capture: true, passive: true }); });
  function focusLb(){
    var t = kbdNav ? $("#lbClose") : $("#capLb");
    try { t.focus({ preventScroll: true }); } catch(e){ t.focus(); }
  }

  /* ---------------- lightbox ---------------- */
  function renderLb(){
    var p = lbList[lbIdx];
    if (!p) return;
    var full = fullFor(p.src);
    [$("#lbImg"), $("#lbImgDim")].forEach(function(img){
      img.onerror = (full !== p.src) ? function(){ img.onerror = null; img.src = p.src; } : null;
      img.src = full;
    });
    $("#lbImg").alt = p.alt || p.title || "";
    /* fetch the photos either side now, so Next/Previous (and swipes) show up instantly */
    if (lbList.length > 1) [1, -1].forEach(function(d){
      var q = lbList[(lbIdx + d + lbList.length) % lbList.length];
      if (q) { var pre = new Image(); pre.decoding = "async"; pre.src = fullFor(q.src); }
    });
    $("#lbCap").textContent = [p.title, p.caption].filter(Boolean).join(" — ");
  }
  function closeLb(){ closeOverlay("lb"); }
  $("#lbClose").addEventListener("click", closeLb);
  $("#lbPrev").addEventListener("click", function(){ if (!lbList.length) return; lbIdx = (lbIdx - 1 + lbList.length) % lbList.length; renderLb(); });
  $("#lbNext").addEventListener("click", function(){ if (!lbList.length) return; lbIdx = (lbIdx + 1) % lbList.length; renderLb(); });
  $("#capLb").addEventListener("click", function(e){ if (e.target.id === "capLb") closeLb(); });
  (function(){
    var lbEl = $("#capLb"), sx = 0, sy = 0, st = 0, tracking = false;
    lbEl.addEventListener("touchstart", function(e){
      tracking = e.touches.length === 1;
      if (tracking) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); }
    }, {passive:true});
    lbEl.addEventListener("touchmove", function(e){ if (e.touches.length > 1) tracking = false; }, {passive:true});
    lbEl.addEventListener("touchend", function(e){
      if (!tracking) return; tracking = false;
      if ($("#lbStage").classList.contains("lamp-on")) return;   /* with Spotlight on, the finger steers the light */
      var t = e.changedTouches && e.changedTouches[0]; if (!t || Date.now() - st > 800) return;
      var dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) { $(dx < 0 ? "#lbNext" : "#lbPrev").click(); }
      else if (dy > 100 && dy > Math.abs(dx) * 1.5) { closeLb(); }
    }, {passive:true});
  })();

  /* ---------------- enquiry form ----------------
     The window itself lives in /shared.js so it looks and behaves exactly the same on every page
     (including its own Back-button step). If that file ever fails to load, Enquire still works by
     opening the visitor's mail app instead of doing nothing. */
  function enqOpen(){ return !!(window.LRL && LRL.enquiry && LRL.enquiry.isOpen()); }
  function openEnquiry(){
    var cat = currentCat || "General Enquiry";
    if (window.LRL && LRL.enquiry) {
      LRL.enquiry.open({ category: cat, eventType: currentEvent || "" });
      return;
    }
    var to = (DATA && DATA.email) || "hello@livingroomlabs.in";
    window.location.href = "mailto:" + to + "?subject=" + encodeURIComponent("Enquiry: " + cat + (currentEvent ? " (" + currentEvent + ")" : ""));
  }
  $("#capFootEnquire").addEventListener("click", openEnquiry);
  $("#capBrand").addEventListener("click", function(){ window.location.href = "/"; });
  /* belt and braces for the footer logo: a finger or mouse press only counts if it lands on the logo
     artwork (plus a few px), never on the empty bar around it. Keyboard Enter/Space always works. */
  $("#capFootHome").addEventListener("click", function(e){
    e.stopPropagation();
    var art = this.querySelector(".lg-crop");
    if (art && e.detail > 0 && (e.clientX || e.clientY)) {
      var r = art.getBoundingClientRect(), pad = 6;
      if (e.clientX < r.left - pad || e.clientX > r.right + pad || e.clientY < r.top - pad || e.clientY > r.bottom + pad) return;
    }
    window.location.href = "/";
  });

  /* ---------------- keyboard ---------------- */
  document.addEventListener("keydown", function(e){
    if (enqOpen()) return; /* the enquiry window handles its own keys (Escape, Tab) */
    if (openOverlay === "lb") {
      if (e.key === "Escape") closeLb();
      else if (e.key === "ArrowLeft") $("#lbPrev").click();
      else if (e.key === "ArrowRight") $("#lbNext").click();
      return;
    }
    if (e.key === "Escape" && currentCat) { goDiscover(); return; }
    if (!currentCat && track) {
      if (e.key === "ArrowLeft") nudge(-1);
      else if (e.key === "ArrowRight") nudge(1);
    }
  });

  /* ---------------- "View" tag: follows a real mouse over photos you can open ---------------- */
  (function(){
    if (!window.matchMedia || !window.matchMedia("(hover:hover) and (pointer:fine)").matches) return;
    var tag = null, x = 0, y = 0, on = false, raf = 0;
    function place(){ raf = 0; tag.style.translate = (x + 16) + "px " + (y + 18) + "px"; }
    function set(show){
      if (show === on) return;
      on = show;
      if (show) place();
      tag.classList.toggle("on", show);
    }
    document.addEventListener("pointermove", function(e){
      if (e.pointerType && e.pointerType !== "mouse") return;
      if (!tag) { tag = document.createElement("div"); tag.className = "lrl-view-tag"; tag.setAttribute("aria-hidden", "true"); tag.textContent = "View"; document.body.appendChild(tag); }
      x = e.clientX; y = e.clientY;
      var t = e.target && e.target.closest ? e.target.closest(".cat-card, .disc-card.is-center") : null;
      set(!!t && openOverlay !== "lb");
      if (on && !raf) raf = requestAnimationFrame(place);
    }, {passive:true});
    document.documentElement.addEventListener("mouseleave", function(){ if (tag) set(false); });
    document.addEventListener("pointerdown", function(){ if (tag) set(false); }, {passive:true});
  })();

  /* ---------------- url params (footer Events links, shared links, reloads) ---------------- */
  function resolveCat(name){
    if (!name) return null;
    var want = String(name).trim().toLowerCase(), all = NICHES.map(function(n){ return (n && n.name) || n; });
    PHOTOS.forEach(function(p){ if (p.category && all.indexOf(p.category) === -1) all.push(p.category); });
    for (var i = 0; i < all.length; i++) if (String(all[i]).toLowerCase() === want) return all[i];
    return null;
  }
  function applyParams(){
    var params = new URLSearchParams(window.location.search);
    var raw = params.get("category"), cat = resolveCat(raw);
    var ev = params.get("event");
    if (cat) {
      showCategory(cat, ev || null, "none");
      /* tidy a mistyped link (wrong capitals, an event that no longer exists) to the real names */
      if (raw !== cat || (ev || null) !== currentEvent) updateUrl(currentCat, currentEvent, false, false);
    }
    else if (raw) updateUrl(null, null, false, false);   /* old or mistyped link: just show Discover */
  }
})();
</script>
</body>
