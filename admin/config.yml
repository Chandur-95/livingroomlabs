backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "website"
    label: "Website Content"
    files:
      - file: "content.json"
        label: "Settings & Portfolio"
        name: "content"
        fields:
          - { label: "Site Name", name: "name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "City", name: "city", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - label: "Body Font"
            name: "bodyFont"
            widget: "select"
            options: ["Inter", "Archivo", "Playfair Display", "Space Grotesk"]
            default: "Inter"
          - { label: "Hero Lines", name: "hero", widget: "list", field: { label: "Line", widget: "string" } }
          - label: "Hero Banner Shoot"
            name: "band"
            widget: "object"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string", required: false }
          - { label: "Statement", name: "statement", widget: "string" }
          - { label: "Statement Attribution", name: "statementBy", widget: "string" }
          
          # WHAT WE SHOOT (NICHES)
          - label: "What We Shoot (Niches)"
            name: "niches"
            widget: "list"
            fields:
              - { label: "Niche Name", name: "name", widget: "string" }
              - { label: "Description Line", name: "line", widget: "string" }

          - { label: "Contact Note", name: "contactNote", widget: "text" }

          # WORK GALLERY PHOTOGRAPHS (Linked with Category Dropdown)
          - label: "Work Gallery Photographs"
            name: "photos"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Client", name: "client", widget: "string" }
              - label: "Category / Niche"
                name: "category"
                widget: "select"
                options: ["Food", "Pets", "Architecture", "Products", "Events", "Portraits"]
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Video Link (Optional)", name: "videoUrl", widget: "string", required: false }
              - { label: "Caption", name: "caption", widget: "string", required: false }
              - { label: "Grid Width Weight (1-8)", name: "w", widget: "number", value_type: "int", default: 4, min: 1, max: 12 }
              - label: "Aspect Ratio"
                name: "ratio"
                widget: "select"
                options: ["4/5", "1/1", "3/4", "3/2", "16/9"]
                default: "4/5"
              - label: "Image Vertical Focal Point"
                name: "imagePosition"
                widget: "select"
                options: ["Top", "Center", "Bottom"]
                default: "Center"
