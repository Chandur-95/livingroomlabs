backend:
  name: github
  repo: Chandur-95/livingroomlabs
  branch: main
  base_url: https://decap-cms-oauth.vercel.app
  auth_endpoint: auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "website"
    label: "Website Content"
    files:
      - file: "content.json"
        label: "Settings & Portfolio"
        name: "content"
        fields:
          - { label: "Site Name", name: "name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "City", name: "city", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - label: "Body Font"
            name: "bodyFont"
            widget: "select"
            options: ["Inter", "Archivo", "Playfair Display", "Space Grotesk"]
            default: "Inter"

          # PRINCIPALS & VISUAL CREATORS (THE COLLECTIVE)
          - label: "The Collective (Principals & Visual Creators)"
            name: "team"
            widget: "list"
            fields:
              - { label: "Full Name", name: "name", widget: "string" }
              - { label: "Role / Title", name: "role", widget: "string" }
              - { label: "Profile Photo", name: "photo", widget: "image" }
              - label: "Photo Focal Point"
                name: "imagePosition"
                widget: "select"
                options: ["Top", "Center", "Bottom"]
                default: "Center"
              - { label: "Bio / Description", name: "bio", widget: "text", required: false }
              - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
              - { label: "Portfolio / Work URL", name: "portfolio", widget: "string", required: false }

          - label: "Collective Hero Image"
            name: "teamHeroImg"
            widget: "image"
            required: false
          - label: "Collective Hero Image Position"
            name: "teamHeroImgPosition"
            widget: "select"
            options: ["Top", "Center", "Bottom"]
            default: "Center"
            required: false
          - { label: "Collective Hero Intro", name: "teamHeroIntro", widget: "text", required: false }

          # HERO SLIDESHOW (MULTIPLE PHOTOS)
          - label: "Hero Banner Slideshow"
            name: "bandSlides"
            widget: "list"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string", required: false }
              - label: "Focal Position"
                name: "imagePosition"
                widget: "select"
                options: ["Top", "Center", "Bottom"]
                default: "Center"
          
          # FALLBACK SINGLE BAND SETTINGS (To preserve existing JSON structure)
          - { label: "Band Fallback Image", name: "bandImg", widget: "image", required: false }
          - label: "Band Fallback Position"
            name: "bandImgPosition"
            widget: "select"
            options: ["Top", "Center", "Bottom"]
            default: "Center"
            required: false
          - { label: "Band Fallback Alt", name: "bandAlt", widget: "string", required: false }

          # HERO BANNER & NICHES
          - label: "Hero Lines"
            name: "hero"
            widget: "list"
          - { label: "Statement", name: "statement", widget: "string" }
          - { label: "Statement Attribution", name: "statementBy", widget: "string" }
          - label: "What We Shoot (Niches)"
            name: "niches"
            widget: "list"
            fields:
              - { label: "Niche Name", name: "name", widget: "string" }
              - { label: "Description Line", name: "line", widget: "string" }
          - { label: "Contact Note", name: "contactNote", widget: "text" }

          # PHOTOS & PORTFOLIO
          - label: "Photos & Portfolio"
            name: "photos"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Client", name: "client", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Food", "Pets", "Architecture", "Products", "Events", "Portraits"]
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Show in 'All' (Toggle on/off)", name: "featured", widget: "boolean", default: true }
              - { label: "Grid Width Weight (1-12)", name: "w", widget: "number", value_type: "int", required: false }
              - { label: "Video Link (Optional)", name: "videoUrl", widget: "string", required: false }
              - { label: "Caption", name: "caption", widget: "string", required: false }
              - label: "Aspect Ratio"
                name: "ratio"
                widget: "select"
                options: ["4/5", "1/1", "3/4", "3/2", "16/9"]
                default: "4/5"
              - label: "Image Vertical Focal Point"
                name: "imagePosition"
                widget: "select"
                options: ["Top", "Center", "Bottom"]
                default: "Center"
