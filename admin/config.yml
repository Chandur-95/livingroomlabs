backend:
  name: github
  repo: Chandur-95/livingroomlabs
  branch: main
  base_url: https://decap-cms-oauth.vercel.app
  auth_endpoint: auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "website"
    label: "Website Content"
    files:
      - file: "content.json"
        label: "Settings & Portfolio"
        name: "content"
        fields:
          - { label: "Site Name", name: "name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "City", name: "city", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - label: "Body Font"
            name: "bodyFont"
            widget: "select"
            options: ["Inter", "Archivo", "Playfair Display", "Space Grotesk"]
            default: "Inter"
          - label: "Hero Lines"
            name: "hero"
            widget: "list"
            field: { label: "Line", name: "line", widget: "string" }
          - label: "Hero Banner Shoot"
            name: "band"
            widget: "object"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string", required: false }
          - { label: "Statement", name: "statement", widget: "string" }
          - { label: "Statement Attribution", name: "statementBy", widget: "string" }
          - label: "What We Shoot (Niches)"
            name: "niches"
            widget: "list"
            fields:
              - { label: "Niche Name", name: "name", widget: "string" }
              - { label: "Description Line", name: "line", widget: "string" }
          - { label: "Contact Note", name: "contactNote", widget: "text" }
          - label: "Photos & Portfolio"
            name: "photos"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Client", name: "client", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Food", "Pets", "Architecture", "Products", "Events", "Portraits"]
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Feature on Homepage ('All' view limit of 10)", name: "featured", widget: "boolean", default: true }
              - { label: "Video Link (Optional)", name: "videoUrl", widget: "string", required: false }
              - { label: "Caption", name: "caption", widget: "string", required: false }
              - label: "Aspect Ratio"
                name: "ratio"
                widget: "select"
                options: ["4/5", "1/1", "3/4", "3/2", "16/9"]
                default: "4/5"
              - label: "Image Vertical Focal Point"
                name: "imagePosition"
                widget: "select"
                options: ["Top", "Center", "Bottom"]
                default: "Center"
