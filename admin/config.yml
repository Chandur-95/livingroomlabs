backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "site_content"
    label: "Website Content & Settings"
    files:
      - file: "content.json"
        label: "General Settings, Fonts & The Collective"
        name: "general"
        fields:
          - { label: "Site Name", name: "name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "City", name: "city", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - label: "Typography Font"
            name: "bodyFont"
            widget: "select"
            options: ["Inter", "Archivo", "Space Grotesk", "Playfair Display", "JetBrains Mono"]
          - { label: "Hero Lines (one per line)", name: "hero", widget: "list" }
          - { label: "Statement Headline", name: "statement", widget: "string" }
          - { label: "Statement Attribution", name: "statementBy", widget: "string" }
          - { label: "Contact Note", name: "contactNote", widget: "text" }
          
          # --- BAND BANNER CONTROLS ---
          - label: "Full-Bleed Band Image"
            name: "bandImg"
            widget: "image"
          - { label: "Band Vertical Position % (0=Top, 50=Center, 100=Bottom)", name: "bandPosY", widget: "number", default: 50, value_type: "int", min: 0, max: 100 }
          - { label: "Band Zoom % (100 = Normal, 150 = Zoom In)", name: "bandZoom", widget: "number", default: 100, value_type: "int", min: 100, max: 250 }
          - { label: "Band Image Description (Alt text)", name: "bandAlt", widget: "string", required: false }

          # --- THE COLLECTIVE BANNER CONTROLS ---
          - label: "The Collective Banner Image"
            name: "teamHeroImg"
            widget: "image"
          - { label: "Collective Hero Vertical Position % (0=Top, 50=Center, 100=Bottom)", name: "teamHeroPosY", widget: "number", default: 50, value_type: "int", min: 0, max: 100 }
          - { label: "Collective Hero Zoom % (100 = Normal, 150 = Zoom In)", name: "teamHeroZoom", widget: "number", default: 100, value_type: "int", min: 100, max: 250 }
          - { label: "The Collective Intro Text", name: "teamHeroIntro", widget: "string" }
          
          # --- THE COLLECTIVE ROSTER ---
          - label: "The Collective Members"
            name: "team"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Portrait Photo", name: "photo", widget: "image" }
              - { label: "Vertical Position % (0=Top, 50=Center, 100=Bottom)", name: "posY", widget: "number", default: 50, value_type: "int", min: 0, max: 100 }
              - { label: "Horizontal Position % (0=Left, 50=Center, 100=Right)", name: "posX", widget: "number", default: 50, value_type: "int", min: 0, max: 100 }
              - { label: "Zoom % (100=Fit, 120=Slight Crop, 150=Close Crop)", name: "zoom", widget: "number", default: 100, value_type: "int", min: 100, max: 250 }
              - { label: "Bio Summary", name: "bio", widget: "text" }
              - { label: "Instagram Link (Optional)", name: "instagram", widget: "string", required: false }
              - { label: "Portfolio / Work Link (Optional)", name: "portfolio", widget: "string", required: false }
          
          # --- WORK & GALLERY PHOTOS ---
          - label: "Photos & Portfolio"
            name: "photos"
            widget: "list"
            fields:
              - { label: "Photo File", name: "src", widget: "image" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Client", name: "client", widget: "string" }
              - label: "Category / Folder"
                name: "category"
                widget: "select"
                options: ["Food", "Pets", "Real Estate", "Events", "Portraits"]
              - { label: "Vertical Position % (0=Top, 50=Center, 100=Bottom)", name: "posY", widget: "number", default: 50, value_type: "int", min: 0, max: 100 }
              - { label: "Horizontal Position % (0=Left, 50=Center, 100=Right)", name: "posX", widget: "number", default: 50, value_type: "int", min: 0, max: 100 }
              - { label: "Zoom / Crop Scale % (100=Normal, 130=Tight Crop)", name: "zoom", widget: "number", default: 100, value_type: "int", min: 100, max: 250 }
              - { label: "Video Link (Optional)", name: "videoUrl", widget: "string", required: false }
              - { label: "Caption", name: "caption", widget: "string", required: false }
              - { label: "Width Weight (1 to 12)", name: "w", widget: "number", default: 4, value_type: "int" }
              - label: "Aspect Ratio"
                name: "ratio"
                widget: "select"
                options: ["4/5", "1/1", "3/2", "3/4", "16/9"]
                default: "3/4"
