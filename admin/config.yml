backend:
  name: github
  repo: Chandur-95/livingroomlabs
  branch: main
  # If your Cloudflare OAuth worker/Pages function uses a custom URL, keep base_url uncommented:
  # base_url: https://livingroomlabs.in

media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: simple
show_preview_links: false

collections:
  - name: "content"
    label: "Website Content"
    delete: false
    editor:
      preview: false
    files:
      - file: "content.json"
        label: "Complete Studio Config"
        name: "content"
        fields:
          # BRAND & CORE SETTINGS
          - { label: "Site Name", name: "name", widget: "string", default: "Living Room Labs" }
          - { label: "Tagline", name: "tagline", widget: "string", default: "CAPTURE . CREATE . INSPIRE" }
          - { label: "Studio Logo", name: "logo", widget: "image", default: "/logo.png?v=2", required: false }
          - { label: "Studio City / Location", name: "city", widget: "string", default: "Hyderabad, India" }
          - { label: "Contact Email", name: "email", widget: "string", default: "hello@livingroomlabs.in" }
          - { label: "Formspree Form ID", name: "formspreeId", widget: "string", default: "xjykvnoz", required: false, hint: "The ID from formspree.io/f/<ID>" }
          - { label: "Body Font", name: "bodyFont", widget: "string", default: "Inter", required: false }

          # HERO SECTION
          - label: "Hero Headline Lines"
            name: "hero"
            widget: "list"
            collapsed: false
            summary: "{{fields.line}}"
            field: { label: "Line (*wrap words in asterisks for italics*)", name: "line", widget: "string" }

          - label: "Hero Slideshow Images (Auto-rotates)"
            name: "bandSlides"
            widget: "list"
            collapsed: true
            summary: "{{fields.alt}} — {{fields.src}}"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - label: "Image Focal Position"
                name: "imagePosition"
                widget: "select"
                options: ["Center", "Top", "Bottom", "Left", "Right"]
                default: "Center"
                required: false
              - { label: "Alt / Shoot Description", name: "alt", widget: "string", required: false }

          # WHAT WE CAPTURE (NICHES)
          - label: "What We Capture (Categories)"
            name: "niches"
            widget: "list"
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - { label: "Category Name", name: "name", widget: "string" }
              - { label: "Tagline / Short Line", name: "line", widget: "string" }

          # WORK & PORTFOLIO (Streamlined, collapsed cards for fast bulk editing)
          - label: "Portfolio Photos"
            name: "photos"
            widget: "list"
            collapsed: true
            minimize_collapsed: true
            summary: "{{fields.title}} [{{fields.category}}] — {{fields.client}}"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Photo Title", name: "title", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - "Performing Arts"
                  - "Food"
                  - "Pets"
                  - "Architecture"
                  - "Products"
                  - "Events"
                  - "Portraits"
              - { label: "Client / Context", name: "client", widget: "string", required: false, default: "Studio" }
              - { label: "Caption / Description", name: "caption", widget: "text", required: false }
              - label: "Image Focal Position"
                name: "imagePosition"
                widget: "select"
                options: ["Center", "Top", "Bottom", "Left", "Right"]
                default: "Center"
                required: false
              - { label: "Featured in Work Carousel", name: "featured", widget: "boolean", default: true, required: false }

          # THE COLLECTIVE
          - { label: "The Collective Hero Image", name: "teamHeroImg", widget: "image", required: false }
          - label: "The Collective Hero Position"
            name: "teamHeroImgPosition"
            widget: "select"
            options: ["Center", "Top", "Bottom", "Left", "Right"]
            default: "Center"
            required: false
          - { label: "The Collective Hero Intro Text", name: "teamHeroIntro", widget: "text", required: false }

          - label: "The Collective Team Members"
            name: "team"
            widget: "list"
            collapsed: true
            summary: "{{fields.name}} ({{fields.role}})"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - { label: "Bio / Description", name: "bio", widget: "text", required: false }
              - { label: "Primary Photo", name: "photo", widget: "image" }
              - label: "Primary Photo Position"
                name: "imagePosition"
                widget: "select"
                options: ["Center", "Top", "Bottom", "Left", "Right"]
                default: "Center"
                required: false
              - { label: "Secondary Photo (Alternate/Hover)", name: "photo2", widget: "image", required: false }
              - label: "Secondary Photo Position"
                name: "imagePosition2"
                widget: "select"
                options: ["Center", "Top", "Bottom", "Left", "Right"]
                default: "Center"
                required: false
              - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
              - { label: "Portfolio / Website URL", name: "portfolio", widget: "string", required: false }

          # ABOUT & MANIFESTO
          - { label: "Studio Statement / Manifesto", name: "statement", widget: "text", required: false }
          - { label: "Statement Footnote / Byline", name: "statementBy", widget: "string", required: false }

          # CONTACT & MOBILE CALLOUTS
          - { label: "Mobile 'What We Capture' Note", name: "mobileShootNote", widget: "string", required: false, default: "Food, pets, architecture, products, events, and portraits — calibrated per visual requirement." }
          - { label: "Contact Prompt Note", name: "contactNote", widget: "text", required: false }

          # SOCIAL LINKS
          - label: "Elsewhere (Social Links)"
            name: "socials"
            widget: "list"
            collapsed: true
            summary: "{{fields.name}}: {{fields.url}}"
            fields:
              - { label: "Platform Name", name: "name", widget: "string" }
              - { label: "Profile URL", name: "url", widget: "string" }
