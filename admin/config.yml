backend:
  name: github
  repo: Chandur-95/livingroomlabs
  branch: main
  base_url: https://decap-cms-oauth.vercel.app
  auth_endpoint: auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "website"
    label: "Website Content"
    files:
      - file: "content.json"
        label: "Settings & Portfolio"
        name: "content"
        fields:
          - { label: "Site Name", name: "name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "City", name: "city", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - label: "Body Font"
            name: "bodyFont"
            widget: "select"
            options: ["Inter", "Archivo", "Playfair Display", "Space Grotesk"]
            default: "Inter"

          - label: "The Collective (Principals & Visual Creators)"
            name: "team"
            widget: "list"
            fields:
              - { label: "Full Name", name: "name", widget: "string" }
              - { label: "Role / Title", name: "role", widget: "string" }
              - { label: "Profile Photo", name: "photo", widget: "image" }
              - label: "Photo Focal Point"
                name: "imagePosition"
                widget: "select"
                options: ["Top", "Center", "Bottom"]
                default: "Center"
              - { label: "Bio / Description", name: "bio", widget: "text", required: false }
              - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
              - { label: "Portfolio / Work URL", name: "portfolio", widget: "string", required: false }

          - label: "Collective Hero Image"
            name: "teamHeroImg"
            widget: "image"
            required: false
          - label: "Collective Hero Focal Point"
            name: "teamHeroImgPosition"
            widget: "select"
            options: ["Top", "Center", "Bottom"]
            default: "Center"
          - { label: "Collective Hero Intro", name: "teamHeroIntro", widget: "text", required: false }

          - label: "Hero Banner Slideshow"
            name: "bandSlides"
            widget: "list"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Alt Text", name: "alt", widget: "string", required: false }
              - label: "Focal Position"
                name: "imagePosition"
                widget: "select"
                options: ["Top", "Center", "Bottom"]
                default: "Center"

          - label: "Hero Lines"
            name: "hero"
            widget: "list"
            field: { label: "Line", name: "line", widget: "string" }
          
          - { label: "Statement", name: "statement", widget: "string" }
          - { label: "Statement Attribution", name: "statementBy", widget: "string" }
          
          - label: "What We Shoot (Niches)"
            name: "niches"
            widget: "list"
            fields:
              - { label: "Niche Name", name: "name", widget: "string" }
              - { label: "Description Line", name: "line", widget: "string" }
          
          - { label: "Contact Note", name: "contactNote", widget: "text" }

          - label: "Photos & Portfolio"
            name: "photos"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Client", name: "client", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Food", "Pets", "Architecture", "Products", "Events", "Portraits"]
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Show in 'All' (Toggle on/off)", name: "featured", widget: "boolean", default: true }
              - { label: "Width Weight (Grid)", name: "w", widget: "number", value_type: "int", default: 4, required: false }
              - { label: "Caption", name: "caption", widget: "string", required: false }
              - label: "Aspect Ratio"
                name: "ratio"
                widget: "select"
                options: ["4/5", "1/1", "3/4", "3/2", "16/9"]
                default: "4/5"
              - label: "Image Vertical Focal Point"
                name: "imagePosition"
                widget: "select"
                options: ["Top", "Center", "Bottom"]
                default: "Center"
