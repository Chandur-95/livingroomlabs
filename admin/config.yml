# ===================================================================
# Living Room Labs - admin configuration
#
# Every field below writes into content.json, which the website reads.
# Field names must match the site's code exactly, so rename labels
# freely but leave the "name:" values alone.
# ===================================================================

backend:
  name: github
  repo: Chandur-95/livingroomlabs
  branch: main
  # Login goes through Netlify's OAuth client by default, so no
  # base_url line is needed while this site is hosted on Netlify.

# Where uploaded photos are stored. MUST match the folder in your repo.
media_folder: "images/uploads"
public_folder: "/images/uploads"

# Lets you jump to the live site from inside the editor.
site_url: https://lrl4.netlify.app
display_url: https://lrl4.netlify.app

collections:
  - name: "site"
    label: "Website"
    editor:
      preview: false
    files:
      - name: "content"
        label: "Everything on the page"
        file: "content.json"
        description: "Photos first, then the wording, then your studio details. Changes go live about a minute after you save."
        fields:

          # ---------- PHOTOS ----------
          - label: "Photos"
            name: photos
            widget: list
            label_singular: "Photo"
            collapsed: true
            minimize_collapsed: true
            summary: "{{fields.title}} - {{fields.category}}"
            fields:
              - label: "Photo"
                name: src
                widget: image
                hint: "Resize to about 1600px on the long edge first. Straight-from-camera files are 5-8MB and will slow the site down badly."
              - label: "Title"
                name: title
                widget: string
              - label: "Client"
                name: client
                widget: string
                hint: "Put 'Private' if it wasn't a commission."
              - label: "Category"
                name: category
                widget: string
                hint: "Typing a new category creates a new filter button automatically. Spelling must match the Categories list exactly - 'Real Estate', not 'real estate'."
              - label: "Caption"
                name: caption
                widget: string
                required: false
                hint: "One line. Shows in the full-screen viewer."
              - label: "Size on the page"
                name: w
                widget: select
                default: 4
                options:
                  - label: "Small"
                    value: 3
                  - label: "Medium"
                    value: 4
                  - label: "Large"
                    value: 6
                  - label: "Extra large"
                    value: 8
              - label: "Shape of the photo"
                name: ratio
                widget: select
                default: "4/5"
                hint: "Must match the real shape of the image or it will be cropped."
                options:
                  - label: "Portrait (4:5)"
                    value: "4/5"
                  - label: "Tall portrait (3:4)"
                    value: "3/4"
                  - label: "Square (1:1)"
                    value: "1/1"
                  - label: "Landscape (3:2)"
                    value: "3/2"
                  - label: "Wide (16:9)"
                    value: "16/9"

          # ---------- CATEGORIES ----------
          - label: "Categories (What we shoot)"
            name: niches
            widget: list
            label_singular: "Category"
            collapsed: true
            summary: "{{fields.name}}"
            hint: "A category with no photos yet shows as 'Available' rather than disappearing, so clients know you offer it."
            fields:
              - label: "Category name"
                name: name
                widget: string
                hint: "Must match the Category typed on your photos, exactly."
              - label: "One-line description"
                name: line
                widget: string

          # ---------- PAGE TEXT ----------
          - label: "Headline"
            name: hero
            widget: list
            label_singular: "Line"
            hint: "One row per line, exactly as it should break on screen. Wrap a word in *asterisks* to make it italic."
            field:
              label: "Line"
              name: line
              widget: string

          - label: "Wide photo under the headline"
            name: band
            widget: object
            collapsed: true
            fields:
              - label: "Photo"
                name: src
                widget: image
              - label: "Description for screen readers"
                name: alt
                widget: string
                required: false
                hint: "Describe what is in the photo. Leave blank if purely decorative."

          - label: "Statement"
            name: statement
            widget: string
            hint: "The large line in the middle of the page. *Asterisks* make a word italic."

          - label: "Statement second line"
            name: statementBy
            widget: string

          - label: "Contact note"
            name: contactNote
            widget: text
            hint: "The small paragraph under your email address."

          # ---------- STUDIO DETAILS ----------
          - label: "Studio name"
            name: name
            widget: string

          - label: "Tagline"
            name: tagline
            widget: string
            hint: "Shows under the headline. This does NOT change the tagline inside the logo image."

          - label: "City"
            name: city
            widget: string

          - label: "Contact email"
            name: email
            widget: string
            hint: "Used for the large email link and in the footer."

          - label: "Crew"
            name: team
            widget: list
            label_singular: "Person"
            collapsed: true
            summary: "{{fields.name}} - {{fields.role}}"
            required: false
            fields:
              - label: "Name"
                name: name
                widget: string
              - label: "Role"
                name: role
                widget: string

          - label: "Social links"
            name: socials
            widget: list
            label_singular: "Link"
            collapsed: true
            summary: "{{fields.name}}"
            required: false
            fields:
              - label: "Name"
                name: name
                widget: string
              - label: "Full web address"
                name: url
                widget: string
                hint: "Include https:// at the start, for example https://instagram.com/livingroomlabs"

          - label: "Website font"
            name: bodyFont
            widget: select
            default: "Inter"
            hint: "Changes the main typeface. The italic words in the headline use a separate serif and will not change."
            options:
              - "Inter"
              - "Archivo"
              - "Space Grotesk"
              - "Playfair Display"
              - "JetBrains Mono"
