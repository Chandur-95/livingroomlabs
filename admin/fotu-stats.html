<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Fotu stats · Living Room Labs</title>
<style>
  :root{--ink:#0a0a0a;--paper:#fafafa;--line:#e2e2e2;--mute:#6b6b6b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:32px 20px}
  main{max-width:720px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  p.sub{color:var(--mute);margin:0 0 24px;font-size:14px}
  form{display:flex;gap:8px;margin-bottom:24px}
  input{flex:1;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
  button{font:inherit;font-size:14px;padding:10px 16px;border:0;border-radius:10px;background:var(--ink);color:#fff;cursor:pointer}
  .msg{color:#c0392b;font-size:14px;min-height:20px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
  th{font-weight:600;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  td.n{font-variant-numeric:tabular-nums}
  .big{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
  .card b{display:block;font-size:26px}
  .card span{font-size:12px;color:var(--mute)}
  @media (max-width:560px){.big{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>Fotu stats</h1>
  <p class="sub">How many visitors open Fotu's chat, and how many send an enquiry. Totals only.</p>
  <form id="f"><input id="k" type="password" placeholder="Stats password (STATS_KEY)" autocomplete="current-password" aria-label="Stats password"><button>Show</button></form>
  <div class="msg" id="msg"></div>
  <div id="out"></div>
</main>
<script>
(function(){
  var f=document.getElementById("f"),k=document.getElementById("k"),msg=document.getElementById("msg"),out=document.getElementById("out");
  try{ k.value=sessionStorage.getItem("fotu_stats_key")||""; }catch(e){}
  function n(o,key){ return (o && o[key]) || 0; }
  function rate(a,b){ return b ? Math.round(a/b*100)+"%" : "–"; }
  f.addEventListener("submit",function(e){
    e.preventDefault(); msg.textContent="Loading..."; out.innerHTML="";
    fetch("/api/fotu-stats?key="+encodeURIComponent(k.value),{cache:"no-store"})
      .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
      .then(function(res){
        if(!res.ok){ msg.textContent = res.d.error==="wrong key" ? "That password doesn't match." : (res.d.error||"Couldn't load the numbers."); return; }
        try{ sessionStorage.setItem("fotu_stats_key",k.value); }catch(e){}
        msg.textContent="";
        var months=res.d.months||{}, keys=Object.keys(months).sort().reverse();
        if(!keys.length){ out.innerHTML="<p>No chats yet. Fotu is waiting for its first visitor.</p>"; return; }
        var cur=months[keys[0]];
        var html='<div class="big">'+
          '<div class="card"><b>'+n(cur,"open")+'</b><span>Chats opened ('+keys[0]+')</span></div>'+
          '<div class="card"><b>'+n(cur,"sent")+'</b><span>Enquiries sent ('+keys[0]+')</span></div>'+
          '<div class="card"><b>'+rate(n(cur,"sent"),n(cur,"open"))+'</b><span>Chats that became enquiries</span></div></div>';
        html+='<table><thead><tr><th>Month</th><th>Opened</th><th>Sent</th><th>Home: opened / sent</th><th>Capture: opened / sent</th></tr></thead><tbody>';
        keys.forEach(function(m){ var o=months[m];
          html+='<tr><td>'+m+'</td><td class="n">'+n(o,"open")+'</td><td class="n">'+n(o,"sent")+'</td><td class="n">'+n(o,"open:home")+' / '+n(o,"sent:home")+'</td><td class="n">'+n(o,"open:capture")+' / '+n(o,"sent:capture")+'</td></tr>';
        });
        out.innerHTML=html+'</tbody></table>';
      })
      .catch(function(){ msg.textContent="Couldn't reach the stats service. Is the site deployed with the function?"; });
  });
  if(k.value) f.requestSubmit ? f.requestSubmit() : f.dispatchEvent(new Event("submit"));
})();
</script>
</body>
</html>
